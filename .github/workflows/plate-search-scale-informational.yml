name: Plate Search Scale (informational)

# INFORMATIONAL DIAGNOSTIC ONLY (Stage 4 PR-4; owner decision 2026-10-16 on cold review P1-1).
#
# - Not part of the MAVI Quality Gate: no `quality` lane, not in `quality.needs`, and not a required
#   check or merge gate (docs/runbooks/ci-checks-and-merge-gates.md). A failure here blocks nothing.
# - Not qualification evidence and not Development evidence: its output states
#   `qualificationEvidence: false`, is retained outside the Quality Gate evidence directory, and is named
#   `*-ci-diagnostic*`, distinct from the Development-host measurement files.
# - What it checks, on CI PostgreSQL with the frozen skewed corpus (PlateSearchScaleMeasurementTests,
#   mode `ci`): the intended plan shape of the real statements, and a catastrophic bound (an order of
#   magnitude above the Development budget) that only a change of complexity class would exceed. The
#   plan §2.8 budget of 300 ms is judged on the pinned Development host only, never here.
# - Bound to the exact head: the checkout is verified against the pull request head (or pushed) SHA.
#
# Record: docs/qualification/stage4/2026-10-13-plate-search-at-scale.md.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/platform/Mavi.Infrastructure/Persistence/**'
      - 'src/platform/Mavi.Application/Modules/Intelligence/**'
      - 'tests/Mavi.IntegrationTests/PlateSearchScaleMeasurementTests.cs'
      - 'tests/Mavi.IntegrationTests/Qualification/SqlCapture.cs'
      - '.github/workflows/plate-search-scale-informational.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavi-plate-search-scale-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVI_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  plate-search-scale-diagnostic:
    name: plate search at scale (informational CI diagnostic, not a gate)
    runs-on: ubuntu-latest
    # Seeding 10^6 Tracks and building the trigram index dominates.
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mavi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mavi_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      MAVI_TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=mavi_test;Username=postgres;Password=postgres
      # A scratch database of its own: the measurement never touches mavi_test.
      MAVI_PLATE_SEARCH_SCALE_DB: Host=localhost;Port=5432;Database=mavi_plate_scale;Username=postgres;Password=postgres
      MAVI_PLATE_SEARCH_SCALE_MODE: ci
      MAVI_PLATE_SEARCH_SCALE_OUT: ${{ github.workspace }}/plate-search-scale-ci-diagnostic
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the integration tests
        run: dotnet build tests/Mavi.IntegrationTests/Mavi.IntegrationTests.csproj --configuration Release
      - name: Run the informational plate search diagnostic at scale
        timeout-minutes: 35
        run: >-
          dotnet test tests/Mavi.IntegrationTests/Mavi.IntegrationTests.csproj
          --configuration Release --no-build
          --filter FullyQualifiedName~PlateSearchScaleMeasurementTests
          --logger "trx;LogFileName=plate-search-scale-ci-diagnostic.trx"
          --logger "console;verbosity=detailed"
          --results-directory plate-search-scale-ci-diagnostic
      - name: Retain the informational diagnostic (not qualification evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plate-search-scale-informational-ci-diagnostic
          path: plate-search-scale-ci-diagnostic/
          include-hidden-files: false
          retention-days: 14
          if-no-files-found: warn
