name: Task 10 Runtime Qualification

on:
  pull_request:
    branches:
      - main
      - feature/task-10-rtmdet-bytetrack
    # No path filter: a path-filtered workflow never reports on an unrelated pull
    # request, so its gate could not be a required check. The scope job below
    # applies tools/vision/task10-scope-paths.txt (the same globs as push) instead.
  push:
    branches:
      - main
      - feature/task-10-rtmdet-bytetrack
    paths:
      - 'tools/vision/probe_runtime.py'
      - 'tools/vision/resolve_mmdet_config.py'
      - 'tools/vision/mmcv_wheel_cache.py'
      - 'tools/vision/task10_environment.py'
      - 'tools/vision/compare_wheel_reproducibility.py'
      - 'tools/vision/task10-s1-harness-requirements.txt'
      - 'tools/vision/task10-scope-paths.txt'
      - 'tools/vision/task10_scope.py'
      - 'src/vision/tests/test_runtime_probe.py'
      - 'src/vision/tests/test_resolve_mmdet_config.py'
      - 'src/vision/tests/test_runtime_metadata.py'
      - 'src/vision/tests/test_rtmdet_colour_space.py'
      - 'src/vision/tests/test_mmdetection_runtime.py'
      - 'src/vision/tests/test_production_processor*.py'
      - 'src/vision/tests/test_process_video.py'
      - 'src/vision/tests/test_track_lifecycle.py'
      - 'src/vision/tests/test_trajectory_spool.py'
      - 'src/vision/tests/test_evidence_*.py'
      - 'src/vision/tests/evidence_fixtures.py'
      - 'src/vision/tests/profile_fixtures.py'
      - 'tools/vision/dev/scripted_corpus.py'
      - 'tools/vision/dev/measure_evidence_real_clips.py'
      - 'src/vision/tests/test_measure_evidence_real_clips.py'
      - 'tests/fixtures/scene-analytics/scripted-corpus-v1.json'
      # S1.4 §10.1: the whole vision package is behavior-bearing. A growing
      # list of subpackages let worker/**, common/control_plane.py (the v3
      # completion contract), common/lease.py and detection/rtmdet.py merge
      # without this workflow running.
      - 'src/vision/mavi_vision/**'
      - 'src/vision/tests/test_bytetrack_*.py'
      - 'src/vision/tests/test_worker_completion_v3.py'
      # S1.4 B3 F4 plan §14: the worker client/runner 3.1 behaviour is B4 evidence.
      - 'src/vision/tests/test_worker_client.py'
      - 'src/vision/tests/test_worker_runner.py'
      - 'src/vision/tests/test_completion_contract_*.py'
      - 'src/vision/tests/test_tracker_update.py'
      - 'src/vision/tests/test_track_finalization.py'
      - 'src/vision/tests/test_artifact_store*.py'
      - 'src/vision/tests/test_artifact_publisher.py'
      - 'src/vision/tests/test_analytical_models.py'
      - 'src/vision/tests/test_s1_bound_agreement.py'
      - 'src/vision/tests/test_runtime_errors.py'
      - 'contracts/schemas/vision-job-complete-v3.schema.json'
      - 'contracts/examples/vision-job-complete-v3.example.json'
      # Exactly s1_evidence.S1_QUALIFICATION_HARNESS (S1.4 plan §2.1): the S1
      # harness, not later-stage qualification tooling, which has the Quality Gate
      # and the Qualification Tooling Windows workflow instead.
      - 'tools/qualification/s1_*'
      - 'tools/qualification/s1-*'
      - 'tools/qualification/process_memory.py'
      - 'tools/qualification/tests/conftest.py'
      - 'tools/qualification/tests/fixtures/**'
      - 'tools/qualification/tests/test_s1_*'
      - 'src/vision/pyproject.toml'
      - 'src/vision/runtime/**/*.json'
      - 'src/vision/config/pipelines/**/*.json'
      - 'src/vision/config/components/**/*.json'
      - 'config/acceptance/capability-gate-sets-v1.json'
      - 'models/manifests/**/*.json'
      - 'models/qualifications/**/*.json'
      - '.github/workflows/task10-runtime-qualification.yml'
      - 'docs/decisions/ADR-005-qualified-vision-runtime.md'
      - 'docs/superpowers/specs/2026-09-11-task-10-rtmdet-bytetrack-design.md'
      - 'docs/superpowers/plans/2026-09-11-task-10-rtmdet-bytetrack.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavi-task10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does Task 10 apply? On a pull request, only when its merge commit changes a path
  # in tools/vision/task10-scope-paths.txt; on push and dispatch, always (push keeps
  # its path filter). The scope list, the tool and the diff all come from the merge
  # commit (github.sha), the commit GitHub runs this workflow from. Any doubt
  # answers "applicable".
  scope:
    name: Task 10 scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      applicable: ${{ steps.scope.outputs.applicable }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether Task 10 applies
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "applicable=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$RUNNER_TEMP/task10-changed-paths"
          # The merge commit's first parent is the base branch, so this is exactly what
          # merging changes. --no-renames lists both paths of a rename.
          if test "$(git rev-parse HEAD)" = "$GITHUB_SHA" \
              && git rev-parse --verify --quiet 'HEAD^2' >/dev/null \
              && git diff --no-renames --name-only -z 'HEAD^1' HEAD > "$changed"; then
            python3 tools/vision/task10_scope.py applicable --files "$changed" | tee -a "$GITHUB_OUTPUT"
          else
            echo "task10-scope: merge commit diff unavailable; running Task 10" >&2
            echo "applicable=true" | tee -a "$GITHUB_OUTPUT"
          fi

  cpu-candidate:
    name: CPU ${{ matrix.os }} Python ${{ matrix.python-version }} Torch 2.6.0
    needs: scope
    if: needs.scope.outputs.applicable == 'true'
    permissions:
      contents: read
      # Read a producing run and its evidence artifact to attest a reused MMCV wheel.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12.14'
            runtime-variant: linux-x86_64-cpu
          - os: windows-latest
            python-version: '3.12.10'
            runtime-variant: windows-x86_64-cpu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MMCV_WITH_OPS: '1'
      # Compile parallelism only (4-vCPU runners); not correctness-bearing
      # (tools/vision/verify_windows_cuda_toolchain.py) and deliberately not part of
      # the MMCV reuse identity. Byte reproducibility of the MMCV wheel is Task 12's
      # contract, which keeps its own MAX_JOBS=1.
      MAX_JOBS: '4'
      # The MMCV build inputs that enter the reuse identity (tools/vision/mmcv_wheel_cache.py).
      # The build step below runs exactly MMCV_BUILD_COMMAND (a test holds them equal).
      MMCV_SOURCE_COMMIT: 57c4e25e06e2d4f8a9357c84bcd24089a284dc88
      MMCV_BUILD_COMMAND: python -m pip wheel --no-build-isolation --no-deps -v -w ../.mmcv-wheel .
      RTMDET_CHECKPOINT_URL: https://download.openmmlab.com/mmdetection/v3.0/rtmdet/rtmdet_m_8xb32-300e_coco/rtmdet_m_8xb32-300e_coco_20220719_112220-229f527c.pth
      RTMDET_CHECKPOINT_SHA256: 229f527ca88498e8894a778a62a878a322b4a3ea2cae09ea537d34b7e907792b
      MAVI_EVENT_SHA: ${{ github.sha }}
      MAVI_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MAVI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      MAVI_RUNTIME_VARIANT: ${{ matrix.runtime-variant }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # One PyPI resolution for every Task 10 job of this head: the candidate and the
      # S1 harness install at different times (and failed jobs can be re-run later), so
      # both consider only distributions uploaded before GitHub created this workflow run. The
      # final gate requires the harness closure to match the candidate version for
      # version. pip is pinned first because --uploaded-prior-to needs pip >= 26.
      - name: Pin pip and the PyPI resolution cutoff
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install "pip==26.2.1"
          cutoff="$(python tools/vision/task10_environment.py cutoff)"
          echo "MAVI_PIP_CUTOFF=$cutoff" >> "$GITHUB_ENV"

      - name: Install compatible build tooling
        run: >-
          python -m pip install --upgrade --uploaded-prior-to ${{ env.MAVI_PIP_CUTOFF }}
          "setuptools==80.9.0"
          wheel
          ninja
          psutil
          pytest
          "numpy==2.5.3"
          "av==16.1.0"
          "Pillow==11.3.0"
          "msgpack>=1.1,<2"
          "pydantic>=2.11,<3"
          "pydantic-settings>=2.10,<3"
          "httpx>=0.28,<0.29"
          "packaging>=26,<27"
          "jsonschema>=4.23,<5"

      # Every evidence-bearing pytest step writes JUnit XML under
      # qualification-evidence/junit/, uploaded with the other records, so the
      # S1.4 pass/skip/fail counts (plan §3, §4) never depend on expiring logs.
      # The three probe tests that need torch or mmengine run after the ML graph
      # is installed ("Test real PyTorch restricted checkpoint loading"), not
      # here, so neither step reports a skip for a dependency installed later.
      # --deselect takes node ids relative to the pytest rootdir (src/vision).
      - name: Run runtime qualification tooling unit tests
        run: >-
          python -m pytest
          src/vision/tests/test_runtime_probe.py
          src/vision/tests/test_resolve_mmdet_config.py
          src/vision/tests/test_runtime_metadata.py
          --deselect tests/test_runtime_probe.py::test_reviewed_checkpoint_globals_cover_legacy_and_numpy2_numpy_aliases
          --deselect tests/test_runtime_probe.py::test_real_torch_scope_allows_reviewed_numpy_metadata_and_restores_globals
          --deselect tests/test_runtime_probe.py::test_real_torch_scope_rejects_unapproved_type_and_restores_globals
          -q
          -o junit_suite_name=${{ matrix.runtime-variant }} --junitxml=qualification-evidence/junit/runtime-tooling.xml

      - name: Run production runtime boundary unit tests without ML imports
        working-directory: src/vision
        run: >-
          python -m pytest
          tests/test_rtmdet_colour_space.py
          tests/test_mmdetection_runtime.py
          tests/test_runtime_errors.py
          tests/test_bytetrack_profile_semantics.py
          tests/test_bytetrack_adapter.py
          tests/test_production_processor.py
          tests/test_process_video.py
          tests/test_track_lifecycle.py
          tests/test_trajectory_spool.py
          tests/test_evidence_profile.py
          tests/test_evidence_quality.py
          tests/test_evidence_encoder.py
          tests/test_evidence_selector.py
          tests/test_evidence_admission.py
          tests/test_evidence_pipeline.py
          tests/test_evidence_scripted_corpus.py
          tests/test_worker_completion_v3.py
          tests/test_worker_client.py
          tests/test_worker_runner.py
          tests/test_completion_contract_bounds.py
          tests/test_tracker_update.py
          tests/test_track_finalization.py
          tests/test_artifact_store.py
          tests/test_artifact_store_windows.py
          tests/test_artifact_publisher.py
          tests/test_analytical_models.py
          tests/test_s1_bound_agreement.py
          -q
          -o junit_suite_name=${{ matrix.runtime-variant }} --junitxml=../../qualification-evidence/junit/s1-boundary.xml

      - name: Install candidate PyTorch CPU build
        run: >-
          python -m pip install
          torch==2.6.0
          torchvision==0.21.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Verify PyTorch NumPy-2 bridge before MMCV build
        run: >-
          python -c "import numpy as np, torch; x=np.array([1,2,3], dtype=np.float32); y=torch.from_numpy(x); z=y.numpy(); print('numpy-bridge-ok', np.__version__, torch.__version__, z.tolist())"

      - name: Configure MSVC compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      - name: Stabilize Windows PyTorch extension environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "DISTUTILS_USE_SDK=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSSdk=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # MMCV is compiled by Task 10 from the immutable source against the installed
      # PyTorch. Alternatively, a wheel that Task 10 compiled earlier for exactly
      # this build identity is reused after verification. The identity covers the
      # source commit, recipe, Python ABI, PyTorch build, NumPy, build tools and
      # environment, platform, runner image and compiler/SDK. Reuse also requires
      # GitHub to attest that the producer was a trusted Task 10 run: a push or
      # dispatch on the default branch, or a run on this exact head. The key is
      # exact, with no restore-keys. An unverifiable entry is rebuilt; an integrity
      # violation fails the job. Pull-request runs never save, so a PR can neither
      # publish nor shadow an entry.
      - name: Compute MMCV build identity
        id: mmcv-identity
        shell: bash
        run: |
          set -euo pipefail
          digest="$(python tools/vision/mmcv_wheel_cache.py identity --mmcv-commit "$MMCV_SOURCE_COMMIT" --recipe "$MMCV_BUILD_COMMAND|MMCV_WITH_OPS=$MMCV_WITH_OPS" --out .mmcv-identity.json)"
          cat .mmcv-identity.json
          # The month bucket bounds an entry's life well inside the producer's evidence
          # artifact retention (90 days by default), so an entry can always be attested
          # and an unverifiable one is replaced within a month rather than never.
          echo "key=task10-mmcv-wheel-v1-${MAVI_RUNTIME_VARIANT}-${digest}-$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"

      - name: Restore Task 10 MMCV wheel
        id: mmcv-restore
        uses: actions/cache/restore@v4
        with:
          path: .mmcv-wheel
          key: ${{ steps.mmcv-identity.outputs.key }}

      - name: Verify restored MMCV wheel
        id: mmcv-verify
        shell: bash
        env:
          CACHE_HIT: ${{ steps.mmcv-restore.outputs.cache-hit }}
          GITHUB_TOKEN: ${{ github.token }}
          MAVI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MMCV_PRODUCER_ARTIFACT: runtime-probe-${{ matrix.os }}-py3.12-torch2.6.0
        run: |
          set -uo pipefail
          if [ "$CACHE_HIT" != "true" ]; then
            echo "state=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The step shell runs with -e; capture the exit code instead of exiting on it.
          code=0
          python tools/vision/mmcv_wheel_cache.py verify --dir .mmcv-wheel --identity .mmcv-identity.json --attest --artifact-name "$MMCV_PRODUCER_ARTIFACT" --attestation-out .mmcv-attestation.json || code=$?
          case "$code" in
            0) echo "state=reuse" >> "$GITHUB_OUTPUT" ;;
            3) echo "::warning title=MMCV wheel not reused::the restored entry is unverifiable; rebuilding (see the verify output above)"
               rm -rf .mmcv-wheel .mmcv-attestation.json; echo "state=build" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Checkout immutable MMCV 2.1.0 source
        if: steps.mmcv-verify.outputs.state == 'build'
        shell: bash
        run: |
          set -euo pipefail
          git init .qualification-mmcv
          git -C .qualification-mmcv remote add origin https://github.com/open-mmlab/mmcv.git
          git -C .qualification-mmcv fetch --depth 1 origin "$MMCV_SOURCE_COMMIT"
          git -C .qualification-mmcv checkout --detach FETCH_HEAD
          test "$(git -C .qualification-mmcv rev-parse HEAD)" = "$MMCV_SOURCE_COMMIT"

      - name: Build MMCV 2.1.0 wheel against installed PyTorch
        if: steps.mmcv-verify.outputs.state == 'build'
        working-directory: .qualification-mmcv
        run: python -m pip wheel --no-build-isolation --no-deps -v -w ../.mmcv-wheel .

      - name: Record MMCV wheel provenance
        if: steps.mmcv-verify.outputs.state == 'build'
        shell: bash
        run: python tools/vision/mmcv_wheel_cache.py record --dir .mmcv-wheel --identity .mmcv-identity.json

      - name: Save Task 10 MMCV wheel
        # Only the default branch writes entries other refs read. A dispatch run may save
        # into its own ref scope, where only a run on the same head can attest it.
        if: >-
          steps.mmcv-verify.outputs.state == 'build'
          && (github.event_name == 'workflow_dispatch'
              || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
        uses: actions/cache/save@v4
        with:
          path: .mmcv-wheel
          key: ${{ steps.mmcv-identity.outputs.key }}

      - name: Install verified MMCV 2.1.0 wheel
        shell: bash
        env:
          MMCV_WHEEL_STATE: ${{ steps.mmcv-verify.outputs.state }}
          MMCV_WHEEL_KEY: ${{ steps.mmcv-identity.outputs.key }}
        run: |
          set -euo pipefail
          case "$MMCV_WHEEL_STATE" in build|reuse) ;; *) exit 1 ;; esac
          python tools/vision/mmcv_wheel_cache.py verify --dir .mmcv-wheel --identity .mmcv-identity.json
          python -m pip install .mmcv-wheel/*.whl
          mkdir -p qualification-evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          provenance = json.loads(Path(".mmcv-wheel/provenance.json").read_text(encoding="utf-8"))
          state = os.environ["MMCV_WHEEL_STATE"]
          if state == "reuse":
              attestation = json.loads(Path(".mmcv-attestation.json").read_text(encoding="utf-8"))
          else:
              attestation = {"trust": "built-in-this-run", "runId": os.environ["GITHUB_RUN_ID"]}
          record = {
              "state": state,
              "cacheKey": os.environ["MMCV_WHEEL_KEY"],
              "headSha": os.environ["MAVI_EXPECTED_SOURCE_SHA"],
              "runtimeVariant": os.environ["MAVI_RUNTIME_VARIANT"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "attestation": attestation,
              "provenance": provenance,
          }
          Path("qualification-evidence/mmcv-wheel.json").write_text(json.dumps(record, sort_keys=True, indent=1) + "\n", encoding="utf-8")
          print("mmcv-wheel-installed", record["state"], provenance["wheel"]["sha256"])
          PY

      - name: Install remaining candidate graph
        run: >-
          python -m pip install --uploaded-prior-to ${{ env.MAVI_PIP_CUTOFF }}
          mmengine==0.10.7
          mmdet==3.3.0
          trackers==2.6.0
          supervision==0.30.2
          scipy==1.18.1
          opencv-python==5.0.0.93
          av==16.1.0
          Pillow==11.3.0

      - name: Test real PyTorch restricted checkpoint loading
        run: >-
          python -m pytest
          src/vision/tests/test_runtime_probe.py::test_reviewed_checkpoint_globals_cover_legacy_and_numpy2_numpy_aliases
          src/vision/tests/test_runtime_probe.py::test_real_torch_scope_allows_reviewed_numpy_metadata_and_restores_globals
          src/vision/tests/test_runtime_probe.py::test_real_torch_scope_rejects_unapproved_type_and_restores_globals
          -q
          -o junit_suite_name=${{ matrix.runtime-variant }} --junitxml=qualification-evidence/junit/runtime-probe-real-torch.xml

      - name: Verify compiled MMCV ops and dependency imports
        run: >-
          python -c "import mmcv, mmengine, mmdet, torch, torchvision, trackers, supervision, scipy, numpy, cv2, av; from mmcv.ops import nms; print('imports-ok', mmcv.__version__, torch.__version__, numpy.__version__)"

      - name: Verify candidate semantic graph matches runtime metadata
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          import os
          import platform
          import av
          import cv2
          import mmcv
          import mmdet
          import mmengine
          import numpy
          import scipy
          import supervision
          import torch
          import torchvision

          profile = json.load(open(
              "src/vision/runtime/mmdetection-phase1-v1/runtime.json",
              encoding="utf-8",
          ))
          expected = profile["semanticGraph"]
          actual = {
              "torch": torch.__version__.split("+", 1)[0],
              "torchvision": torchvision.__version__.split("+", 1)[0],
              "mmcv": mmcv.__version__,
              "mmengine": mmengine.__version__,
              "mmdet": mmdet.__version__,
              "trackers": importlib.metadata.version("trackers"),
              "supervision": supervision.__version__,
              "scipy": scipy.__version__,
              "numpy": numpy.__version__,
              "opencv": cv2.__version__,
              "opencvPython": importlib.metadata.version("opencv-python"),
              "pillow": importlib.metadata.version("Pillow"),
              "av": av.__version__,
          }
          if actual != expected:
              raise SystemExit(
                  "runtime_semantic_graph_mismatch:"
                  + json.dumps({"actual": actual, "expected": expected}, sort_keys=True)
              )

          variant_name = os.environ["MAVI_RUNTIME_VARIANT"]
          variant = profile["platformVariants"][variant_name]
          expected_binary = variant["binaryVersions"]
          actual_binary = {
              "torch": torch.__version__,
              "torchvision": torchvision.__version__,
          }
          if actual_binary != expected_binary:
              raise SystemExit(
                  "runtime_binary_identity_mismatch:"
                  + json.dumps(
                      {
                          "variant": variant_name,
                          "actual": actual_binary,
                          "expected": expected_binary,
                      },
                      sort_keys=True,
                  )
              )

          expected_python = variant["pythonIdentity"]
          actual_python = {
              "version": platform.python_version(),
              "implementation": platform.python_implementation(),
              "build": list(platform.python_build()),
              "compiler": platform.python_compiler(),
          }
          if actual_python != expected_python:
              raise SystemExit(
                  "runtime_python_identity_mismatch:"
                  + json.dumps(
                      {
                          "variant": variant_name,
                          "actual": actual_python,
                          "expected": expected_python,
                      },
                      sort_keys=True,
                  )
              )

          print("runtime-semantic-graph-ok", json.dumps(actual, sort_keys=True))
          print(
              "runtime-binary-identity-ok",
              variant_name,
              json.dumps(actual_binary, sort_keys=True),
          )
          print(
              "runtime-python-identity-ok",
              variant_name,
              json.dumps(actual_python, sort_keys=True),
          )
          PY

      - name: Run exact Trackers 2.6 ByteTrack qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          MAVI_RUN_QUALIFIED_BYTETRACK_TESTS=1 PYTHONPATH=src/vision python -m pytest src/vision/tests/test_bytetrack_runtime.py -q -o junit_suite_name=${{ matrix.runtime-variant }} --junitxml=qualification-evidence/junit/bytetrack-runtime.xml

          PYTHONPATH=src/vision python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          from mavi_vision.runtime.profile import load_pipeline_profile

          profile_path = Path("src/vision/config/pipelines/phase1-detection-tracking-v1.json")
          profile_sha256 = hashlib.sha256(profile_path.read_bytes()).hexdigest()
          qualification = json.loads(
              Path("models/qualifications/rtmdet-m-coco-phase1-v2.json").read_text(
                  encoding="utf-8"
              )
          )
          # Record v2 carries the pipeline policy under `policies` (S2a.3).
          if qualification["policies"]["pipelineProfileSha256"] != profile_sha256:
              raise SystemExit("bytetrack_qualification_profile_hash_mismatch")

          executed_source_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          expected_source_sha = os.environ["MAVI_EXPECTED_SOURCE_SHA"]
          if executed_source_sha != expected_source_sha:
              raise SystemExit(
                  "bytetrack_qualification_source_sha_mismatch:"
                  + json.dumps(
                      {
                          "executed": executed_source_sha,
                          "expected": expected_source_sha,
                          "event": os.environ["MAVI_EVENT_SHA"],
                          "prHead": os.environ.get("MAVI_PR_HEAD_SHA") or None,
                      },
                      sort_keys=True,
                  )
              )

          profile = load_pipeline_profile(profile_path)
          tracker = profile.tracker
          record = {
              "status": "passed",
              "runtimeVariant": os.environ["MAVI_RUNTIME_VARIANT"],
              "headSha": executed_source_sha,
              "eventSha": os.environ["MAVI_EVENT_SHA"],
              "prHeadSha": os.environ.get("MAVI_PR_HEAD_SHA") or None,
              "profileSha256": profile_sha256,
              "effectiveNativeParameters": {
                  "frame_rate": tracker.reference_frame_rate,
                  "lost_track_buffer": tracker.lost_track_buffer,
                  "track_activation_threshold": tracker.track_activation_threshold,
                  "high_conf_det_threshold": tracker.high_confidence_threshold,
                  "minimum_iou_threshold": tracker.minimum_iou_threshold,
                  "minimum_consecutive_frames": tracker.minimum_consecutive_frames,
              },
              "pythonIdentity": {
                  "version": platform.python_version(),
                  "implementation": platform.python_implementation(),
              },
              "packages": {
                  "trackers": importlib.metadata.version("trackers"),
                  "supervision": importlib.metadata.version("supervision"),
              },
              "testResult": "passed",
              "testSuite": "src/vision/tests/test_bytetrack_runtime.py",
          }
          Path("qualification-evidence/bytetrack-qualification.json").write_text(
              json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print("bytetrack-qualification-ok", json.dumps(record, sort_keys=True))
          PY

      - name: Run real-clip measurement harness composition test
        shell: bash
        run: >-
          MAVI_RUN_QUALIFIED_PRODUCTION_PROCESSOR_TESTS=1 PYTHONPATH=src/vision
          python -m pytest src/vision/tests/test_measure_evidence_real_clips.py -q
          -o junit_suite_name=${{ matrix.runtime-variant }} --junitxml=qualification-evidence/junit/real-clip-harness.xml

      - name: Run exact production attempt composition qualification
        shell: bash
        run: |
          set -euo pipefail
          MAVI_RUN_QUALIFIED_PRODUCTION_PROCESSOR_TESTS=1 PYTHONPATH=src/vision python -m pytest src/vision/tests/test_production_processor_runtime.py -q -o junit_suite_name=${{ matrix.runtime-variant }} --junitxml=qualification-evidence/junit/production-processor-runtime.xml

          PYTHONPATH=src/vision python - <<'PY'
          import importlib.metadata
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          executed_source_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          expected_source_sha = os.environ["MAVI_EXPECTED_SOURCE_SHA"]
          if executed_source_sha != expected_source_sha:
              raise SystemExit(
                  "production_composition_source_sha_mismatch:"
                  f"{executed_source_sha}!={expected_source_sha}"
              )

          record = {
              "status": "passed",
              "testSuite": "src/vision/tests/test_production_processor_runtime.py",
              "headSha": executed_source_sha,
