              "platform": platform.platform(),
          }
          if record["packages"] != {
              "trackers": "2.6.0",
              "supervision": "0.30.2",
          }:
              raise SystemExit(
                  "production_composition_package_drift:"
                  + json.dumps(record["packages"], sort_keys=True)
              )

          root = Path("qualification-evidence")
          root.mkdir(parents=True, exist_ok=True)
          (root / "production-composition-qualification.json").write_text(
              json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(
              "production-composition-qualification-ok",
              json.dumps(record, sort_keys=True),
          )
          PY

      - name: Resolve official RTMDet-M config and fetch checkpoint
        shell: bash
        run: |
          mkdir -p qualification-evidence
          git init .qualification-mmdet
          git -C .qualification-mmdet remote add origin https://github.com/open-mmlab/mmdetection.git
          git -C .qualification-mmdet fetch --depth 1 origin 44ebd17b145c2372c4b700bfb9cb20dbd28ab64a
          git -C .qualification-mmdet checkout --detach FETCH_HEAD
          test "$(git -C .qualification-mmdet rev-parse HEAD)" = "44ebd17b145c2372c4b700bfb9cb20dbd28ab64a"
          python - <<'PY'
          import os
          import urllib.request
          urllib.request.urlretrieve(os.environ['RTMDET_CHECKPOINT_URL'], '.qualification-rtmdet-m.pth')
          PY
          python tools/vision/resolve_mmdet_config.py \
            --input .qualification-mmdet/configs/rtmdet/rtmdet_m_8xb32-300e_coco.py \
            --output qualification-evidence/rtmdet-m-resolved.py \
            > qualification-evidence/resolved-config.json
          python - <<'PY'
          import json

          record = json.load(open(
              "qualification-evidence/resolved-config.json",
              encoding="utf-8",
          ))
          # Since S2a.3 the resolved config is a Model Pack artefact (manifest v2),
          # not a runtime family field.
          manifest = json.load(open(
              "models/manifests/rtmdet-m-coco-phase1-v2.json",
              encoding="utf-8",
          ))
          assert record["status"] == "passed"
          assert record["selfContained"] is True
          actual_hash = record["resolvedConfig"]["sha256"]
          expected_hash = {
              item["artifactRole"]: item["sha256"] for item in manifest["artifacts"]
          }["resolved-config"]
          if actual_hash != expected_hash:
              raise SystemExit(
                  "resolved_config_hash_mismatch:"
                  + json.dumps(
                      {"actual": actual_hash, "expected": expected_hash},
                      sort_keys=True,
                  )
              )
          print("resolved-config-ok", actual_hash)
          PY
          cp src/vision/runtime/mmdetection-phase1-v1/runtime.json qualification-evidence/runtime.json
          # The licence notice is an identity-bearing Model Pack artefact (P-15):
          # the blob byte for byte (`git show` applies no checkout filter).
          git -C .qualification-mmdet show 44ebd17b145c2372c4b700bfb9cb20dbd28ab64a:LICENSE > .qualification-licence
          # The composition evidence: the binding the smoke resolves, and its SHA.
          cp src/vision/config/components/phase1-bindings-v2.json qualification-evidence/phase1-bindings-v2.json
          sha256sum src/vision/config/components/phase1-bindings-v2.json | cut -d' ' -f1 > qualification-evidence/component-binding.sha256
          rm -rf .qualification-mmdet
          test -f qualification-evidence/rtmdet-m-resolved.py

      - name: Prove missing checkpoint fails before runtime loading
        shell: bash
        run: |
          set +e
          python tools/vision/probe_runtime.py \
            --config qualification-evidence/rtmdet-m-resolved.py \
            --checkpoint .qualification-missing.pth \
            --checkpoint-sha256 "$RTMDET_CHECKPOINT_SHA256" \
            --device cpu 2> qualification-evidence/missing.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q checkpoint_missing qualification-evidence/missing.err

      - name: Run real RTMDet-M CPU probe
        shell: bash
        run: |
          set +e
          python tools/vision/probe_runtime.py \
            --config qualification-evidence/rtmdet-m-resolved.py \
            --checkpoint .qualification-rtmdet-m.pth \
            --checkpoint-sha256 "$RTMDET_CHECKPOINT_SHA256" \
            --device cpu > qualification-evidence/runtime-probe.json 2> qualification-evidence/runtime-probe.err
          code=$?
          printf '%s\n' "$code" > qualification-evidence/runtime-probe.exitcode
          cat qualification-evidence/runtime-probe.json
          cat qualification-evidence/runtime-probe.err >&2
          set -e
          exit "$code"

      - name: Run production MMDetectionRuntime smoke on verified local artifacts
        shell: bash
        run: |
          set -euo pipefail
          release_root=".qualification-model-root/rtmdet-m-coco-phase1-v1"
          mkdir -p "$release_root"
          cp .qualification-rtmdet-m.pth "$release_root/rtmdet_m_8xb32-300e_coco_20220719_112220-229f527c.pth"
          cp qualification-evidence/rtmdet-m-resolved.py "$release_root/rtmdet_m_resolved.py"
          cp .qualification-licence "$release_root/LICENSE"

          PYTHONPATH=src/vision python - <<'PY'
          import json
          import os
          import numpy as np
          from pathlib import Path

          import hashlib
          import platform

          from mavi_vision.runtime.activity import InferenceActivity
          from mavi_vision.runtime.binding import load_component_binding
          from mavi_vision.runtime.mmdetection import MMDetectionRuntime
          from mavi_vision.runtime.resolver import (
              RoleComposition,
              RoleCompositionInputs,
              resolve_completion_contract,
          )

          # The worker's own composition root (S2a.3): binding -> role -> Model
          # Pack (by derived id) -> record -> family/variant, Development mode,
          # no installed Runtime Pack (so the source is unpacked-environment).
          binding_path = Path("src/vision/config/components/phase1-bindings-v2.json")
          binding = load_component_binding(binding_path)
          composition = RoleComposition(
              RoleCompositionInputs(
                  component_binding_path=binding_path,
                  role_id="vision",
                  overlay_root=Path("."),
                  model_root=Path(".qualification-model-root"),
                  pipeline_profile_path=Path("src/vision/config/pipelines/phase1-detection-tracking-v1.json"),
                  runtime_pack_manifest_path=None,
                  production_mode=False,
              ),
              completion=resolve_completion_contract(
                  binding.role("vision"),
                  override=None,
                  production_mode=False,
                  emittable_versions=("3.2",),
              ),
              binding=binding,
          )
          resolved = composition.resolve(
              runtime_variant=os.environ["MAVI_RUNTIME_VARIANT"],
              python_version=platform.python_version(),
          )
          selection = resolved.detector_selection()
          if resolved.component_binding_sha256 != hashlib.sha256(binding_path.read_bytes()).hexdigest():
              raise SystemExit("production_runtime_binding_identity_mismatch")
          if resolved.runtime_pack.runtime_pack_source != "unpacked-environment" or resolved.runtime_pack.runtime_pack_id is not None:
              raise SystemExit("production_runtime_pack_source_mismatch")
          if selection.verification_status != "unverified":
              raise SystemExit("production_runtime_unexpected_verification")
          activity = InferenceActivity()
          runtime = MMDetectionRuntime(selection, device="cpu", activity=activity)
          try:
              runtime.warmup()
              image_rgb = np.zeros((48, 80, 3), dtype=np.uint8)
              image_rgb[..., 0] = 29
              image_rgb[..., 1] = 101
              image_rgb[..., 2] = 223
              detections = runtime.infer(image_rgb)
              metadata = runtime.metadata
              if metadata.ordered_class_vocabulary != selection.detector.class_vocabulary:
                  raise SystemExit("production_runtime_vocabulary_mismatch")
              if metadata.device != "cpu":
                  raise SystemExit("production_runtime_device_mismatch")
              expected_binary = selection.runtime_platform_variants[
                  os.environ["MAVI_RUNTIME_VARIANT"]
              ].binary_versions
              actual_binary = {
                  "torch": metadata.versions["torch"],
                  "torchvision": metadata.versions["torchvision"],
              }
              if expected_binary is None or actual_binary != dict(expected_binary):
                  raise SystemExit("production_runtime_binary_identity_mismatch")
              snapshot = activity.snapshot()
              if snapshot.active or snapshot.completed_count != 2:
                  raise SystemExit("production_runtime_activity_mismatch")
              record = {
                  "status": "passed",
                  "backend": metadata.backend,
                  "modelId": metadata.model_id,
                  "device": metadata.device,
                  "predictionCount": len(detections),
                  "activityCompletedCount": snapshot.completed_count,
                  "orderedClassVocabulary": list(metadata.ordered_class_vocabulary),
                  "versions": dict(metadata.versions),
                  "capabilityId": selection.capability.capability_id,
                  "modelPackId": selection.capability.model_pack_id,
                  "qualificationId": selection.capability.qualification.qualification_id,
                  "componentBindingSha256": resolved.component_binding_sha256,
                  "runtimePackSource": resolved.runtime_pack.runtime_pack_source,
                  "runtimePackId": resolved.runtime_pack.runtime_pack_id,
                  "headSha": os.environ["MAVI_EXPECTED_SOURCE_SHA"],
              }
              Path("qualification-evidence/production-runtime-smoke.json").write_text(
                  json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              print("production-runtime-smoke-ok", json.dumps(record, sort_keys=True))
          finally:
              runtime.close()
          PY

      - name: Record candidate environment
        shell: bash
        run: python tools/vision/task10_environment.py record --out qualification-evidence/candidate-environment.json

      - name: Verify qualification evidence set
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path("qualification-evidence")
          required = (
              "runtime-probe.json",
              "runtime-probe.err",
              "runtime-probe.exitcode",
              "resolved-config.json",
              "rtmdet-m-resolved.py",
              "runtime.json",
              "missing.err",
              "production-runtime-smoke.json",
              "bytetrack-qualification.json",
              "production-composition-qualification.json",
              "phase1-bindings-v2.json",
              "component-binding.sha256",
              "mmcv-wheel.json",
              "candidate-environment.json",
          )
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(
                  "qualification_evidence_missing:" + ",".join(sorted(missing))
              )

          if (root / "runtime-probe.exitcode").read_text(encoding="utf-8").strip() != "0":
              raise SystemExit("qualification_probe_exitcode_not_zero")

          probe = json.load((root / "runtime-probe.json").open(encoding="utf-8"))
          if probe.get("status") != "passed":
              raise SystemExit("qualification_probe_status_not_passed")

          production = json.load(
              (root / "production-runtime-smoke.json").open(encoding="utf-8")
          )
          if production.get("status") != "passed":
              raise SystemExit("production_runtime_smoke_not_passed")
          if production.get("device") != "cpu":
              raise SystemExit("production_runtime_smoke_device_invalid")

          bytetrack = json.load(
              (root / "bytetrack-qualification.json").open(encoding="utf-8")
          )
          if bytetrack.get("status") != "passed":
              raise SystemExit("bytetrack_qualification_status_not_passed")
          if bytetrack.get("packages") != {
              "trackers": "2.6.0",
              "supervision": "0.30.2",
          }:
              raise SystemExit("bytetrack_qualification_package_drift")
          import hashlib
          profile_hash = hashlib.sha256(
              Path(
                  "src/vision/config/pipelines/phase1-detection-tracking-v1.json"
              ).read_bytes()
          ).hexdigest()
          if bytetrack.get("profileSha256") != profile_hash:
              raise SystemExit("bytetrack_qualification_profile_hash_mismatch")

          executed_source_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          expected_source_sha = os.environ["MAVI_EXPECTED_SOURCE_SHA"]
          if executed_source_sha != expected_source_sha:
              raise SystemExit("qualification_checkout_source_sha_mismatch")
          if bytetrack.get("headSha") != executed_source_sha:
              raise SystemExit("bytetrack_evidence_source_sha_mismatch")
          expected_pr_head = os.environ.get("MAVI_PR_HEAD_SHA") or None
          if bytetrack.get("prHeadSha") != expected_pr_head:
              raise SystemExit("bytetrack_evidence_pr_head_sha_mismatch")
          if bytetrack.get("eventSha") != os.environ["MAVI_EVENT_SHA"]:
              raise SystemExit("bytetrack_evidence_event_sha_mismatch")

          composition = json.load(
              (root / "production-composition-qualification.json").open(
                  encoding="utf-8"
              )
          )
          if composition.get("status") != "passed":
              raise SystemExit("production_composition_status_not_passed")
          if composition.get("packages") != {
              "trackers": "2.6.0",
              "supervision": "0.30.2",
          }:
              raise SystemExit("production_composition_package_drift")
          if composition.get("headSha") != executed_source_sha:
              raise SystemExit("production_composition_source_sha_mismatch")
          if composition.get("prHeadSha") != expected_pr_head:
              raise SystemExit("production_composition_pr_head_sha_mismatch")
          if composition.get("eventSha") != os.environ["MAVI_EVENT_SHA"]:
              raise SystemExit("production_composition_event_sha_mismatch")

          # The smoke ran the committed binding at this head, not another.
          binding_bytes = (root / "phase1-bindings-v2.json").read_bytes()
          binding_sha = hashlib.sha256(binding_bytes).hexdigest()
          if binding_bytes != Path("src/vision/config/components/phase1-bindings-v2.json").read_bytes():
              raise SystemExit("qualification_binding_copy_mismatch")
          if (root / "component-binding.sha256").read_text(encoding="utf-8").strip() != binding_sha:
              raise SystemExit("qualification_binding_sha_mismatch")
          if production.get("componentBindingSha256") != binding_sha:
              raise SystemExit("production_runtime_smoke_binding_mismatch")
          if production.get("headSha") != executed_source_sha:
              raise SystemExit("production_runtime_smoke_source_sha_mismatch")
          binding = json.loads(binding_bytes)
          (detector,) = [item for item in binding["capabilityBindings"] if item["capabilityId"] == "detector"]
          if production.get("modelPackId") != detector["modelPackId"]:
              raise SystemExit("production_runtime_smoke_model_pack_mismatch")
          if production.get("runtimePackSource") != "unpacked-environment" or production.get("runtimePackId") is not None:
              raise SystemExit("production_runtime_smoke_runtime_pack_mismatch")

          resolved = json.load((root / "resolved-config.json").open(encoding="utf-8"))
          manifest = json.load(Path("models/manifests/rtmdet-m-coco-phase1-v2.json").open(encoding="utf-8"))
          actual_hash = resolved["resolvedConfig"]["sha256"]
          expected_hash = {
              item["artifactRole"]: item["sha256"] for item in manifest["artifacts"]
          }["resolved-config"]
          if actual_hash != expected_hash:
              raise SystemExit(
                  "resolved_config_hash_mismatch:"
                  + json.dumps(
                      {"actual": actual_hash, "expected": expected_hash},
                      sort_keys=True,
                  )
              )
          print("qualification-evidence-ok", actual_hash)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-probe-${{ matrix.os }}-py3.12-torch2.6.0
          path: qualification-evidence/
          include-hidden-files: false
          if-no-files-found: warn

  # The S1.4 qualification harness imports only the native tracker stack
  # (trackers, supervision, scipy, OpenCV, PyAV, NumPy), never PyTorch or the MM
  # stack, so it runs concurrently with the candidate job instead of after the
  # MMCV build. Its environment is the pinned subset of the candidate graph; the
  # final job requires every distribution here to match the candidate's version
  # (docs/qualification/stage2-s1/2026-10-01-task10-harness-separation-and-mmcv-wheel-reuse.md).
  s1-harness:
    permissions:
      contents: read
      actions: read
    name: S1 harness ${{ matrix.os }} Python ${{ matrix.python-version }}
    needs: scope
    if: needs.scope.outputs.applicable == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12.14'
            runtime-variant: linux-x86_64-cpu
          - os: windows-latest
            python-version: '3.12.10'
            runtime-variant: windows-x86_64-cpu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MAVI_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MAVI_RUNTIME_VARIANT: ${{ matrix.runtime-variant }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checked-out source head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # One PyPI resolution for every Task 10 job of this head: the candidate and the
      # S1 harness install at different times (and failed jobs can be re-run later), so
      # both consider only distributions uploaded before GitHub created this workflow run. The
      # final gate requires the harness closure to match the candidate version for
      # version. pip is pinned first because --uploaded-prior-to needs pip >= 26.
      - name: Pin pip and the PyPI resolution cutoff
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install "pip==26.2.1"
          cutoff="$(python tools/vision/task10_environment.py cutoff)"
          echo "MAVI_PIP_CUTOFF=$cutoff" >> "$GITHUB_ENV"

      - name: Install S1 harness subset of the candidate graph
        run: python -m pip install --upgrade --uploaded-prior-to ${{ env.MAVI_PIP_CUTOFF }} -r tools/vision/task10-s1-harness-requirements.txt

      - name: Run S1.4 qualification harness tests with the native ByteTrack backend
        shell: bash
        run: >-
          MAVI_RUN_QUALIFIED_BYTETRACK_TESTS=1 PYTHONPATH=src/vision
          python -m pytest tools/qualification/tests/test_s1_*.py -q
          -o junit_suite_name=${{ matrix.runtime-variant }} --junitxml=qualification-evidence/junit/s1-qualification-harness.xml

      - name: Check retained harness evidence and skips
        shell: bash
        run: python tools/vision/task10_environment.py check-harness --junit qualification-evidence/junit/s1-qualification-harness.xml --variant "$MAVI_RUNTIME_VARIANT"

      - name: Record harness environment
        if: always()
        shell: bash
        run: python tools/vision/task10_environment.py record --closure-roots tools/vision/task10-s1-harness-requirements.txt --out qualification-evidence/s1-harness-environment.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-harness-${{ matrix.os }}-py3.12
          path: qualification-evidence/
          include-hidden-files: false
          if-no-files-found: error

  # Task 10 passes only when every job of both variants succeeded, the harness
  # evidence is present and valid, and each harness ran on a subset of its
  # candidate environment. A failed, cancelled or skipped job fails this gate.
  task10-qualification:
    name: Task 10 qualification
    if: always()
    needs:
      - scope
      - cpu-candidate
      - s1-harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAVI_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Not applicable: passes only when the scope job said so and the Task 10 jobs
      # were skipped. Applicable: every job must succeed and the evidence below hold.
      - name: Require every Task 10 job
        id: require
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.scope.result }}' = 'success'
          applicable='${{ needs.scope.outputs.applicable }}'
          if [ "$applicable" = 'false' ]; then
            test '${{ needs.cpu-candidate.result }}' = 'skipped'
            test '${{ needs.s1-harness.result }}' = 'skipped'
            echo "Task 10 does not apply to this pull request (no path in tools/vision/task10-scope-paths.txt changed)."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$applicable" = 'true'
          test '${{ needs.cpu-candidate.result }}' = 'success'
          test '${{ needs.s1-harness.result }}' = 'success'
          echo "applicable=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.require.outputs.applicable == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checked-out source head
        if: steps.require.outputs.applicable == 'true'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"

      - uses: actions/setup-python@v5
        if: steps.require.outputs.applicable == 'true'
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        if: steps.require.outputs.applicable == 'true'
        with:
          path: task10-evidence/

      - name: Require harness evidence bound to each candidate environment
        if: steps.require.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for pair in ubuntu-latest:linux-x86_64-cpu windows-latest:windows-x86_64-cpu; do
            os="${pair%%:*}"; variant="${pair##*:}"
            candidate="task10-evidence/runtime-probe-${os}-py3.12-torch2.6.0"
            harness="task10-evidence/s1-harness-${os}-py3.12"
            python tools/vision/task10_environment.py check-harness --junit "$harness/junit/s1-qualification-harness.xml" --variant "$variant"
            python tools/vision/task10_environment.py compare --candidate "$candidate/candidate-environment.json" --harness "$harness/s1-harness-environment.json"
            python tools/vision/task10_environment.py check-mmcv --record "$candidate/mmcv-wheel.json" --variant "$variant" --head "$MAVI_EXPECTED_SOURCE_SHA" --run-id "$GITHUB_RUN_ID"
            for step in runtime-tooling s1-boundary runtime-probe-real-torch bytetrack-runtime real-clip-harness production-processor-runtime; do
              test -s "$candidate/junit/$step.xml"
            done
          done
