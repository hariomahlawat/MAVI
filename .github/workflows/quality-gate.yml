name: MAVI Quality Gate

on:
  pull_request:
    branches:
      - main
      - feature/visual-intelligence-memory
      - feature/task-10-rtmdet-bytetrack
  push:
    branches:
      - main
      - feature/visual-intelligence-memory
      - feature/task-10-rtmdet-bytetrack

permissions:
  contents: read

concurrency:
  group: mavi-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mavi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mavi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MAVI_TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=mavi_test;Username=postgres;Password=postgres
      MAVI_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checked-out source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/vision/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/mavi-web/package-lock.json

      - name: Ensure FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*' -delete
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg

      - name: Install Python verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/vision[dev]' -r tools/requirements.txt

      - name: Verify toolchain
        run: |
          dotnet --info
          python --version
          node --version
          npm --version
          ffmpeg -version | head -n 1
          psql --version
          pg_isready -h localhost -p 5432 -U postgres -d mavi_test

      - name: Build .NET
        run: dotnet build MAVI.sln --configuration Release

      # One TRX per test project (the SDK's built-in logger), retained below so an
      # S1.4 evidence record's .NET suite counts come from the results
      # themselves. Every project runs; the step fails if any failed.
      - name: Test .NET
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for project in $(dotnet sln MAVI.sln list | grep '^tests/'); do
            name="$(basename "$project" .csproj)"
            dotnet test "$project" --configuration Release --no-build \
              --logger "trx;LogFileName=${name}.trx" --results-directory qualification-evidence/trx || status=1
          done
          exit "$status"

      - name: Verify repository
        run: python tools/verify_repo.py

      - name: Test Python contracts
        working-directory: src/vision
        run: python -m pytest -q

      - name: Check evidence-assembler guard coverage
        working-directory: ${{ github.workspace }}
        run: python tools/vision/check_guard_coverage.py

      - name: Test Task 17 acceptance tooling
        run: python -m pytest -q tools/phase1/tests

      # S1.4 Harness A: the evidence checker and measurement harnesses. The
      # native-ByteTrack cases run in Task 10's qualified job, not here.
      - name: Test S1.4 qualification tooling
        run: python -m pytest -q -rs tools/qualification/tests

      - name: Install frontend dependencies
        working-directory: src/web/mavi-web
        run: npm ci

      - name: Test frontend
        working-directory: src/web/mavi-web
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=../../../qualification-evidence/junit/mavi-web.xml

      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-test-results
          path: qualification-evidence/
          include-hidden-files: false
          if-no-files-found: warn

      - name: Typecheck frontend
        working-directory: src/web/mavi-web
        run: npm run typecheck

      - name: Build frontend
        working-directory: src/web/mavi-web
        run: npm run build

      - name: Publish production web host
        run: >-
          dotnet publish src/platform/Mavi.Api/Mavi.Api.csproj
          --configuration Release
          --no-restore
          -p:RequireMaviBundledMediaTools=false
          -p:MaviBuild=github-${{ github.run_id }}-${{ github.run_attempt }}
          -p:MaviCommit=${{ github.event.pull_request.head.sha || github.sha }}
          --output .artifacts/task15-host

      - name: Verify production web host composition
        shell: bash
        run: |
          set -euo pipefail
          test -f .artifacts/task15-host/Mavi.Api.dll
          test -f .artifacts/task15-host/web.config
          test -f .artifacts/task15-host/wwwroot/index.html
          test -d .artifacts/task15-host/wwwroot/assets
          grep -q 'maxAllowedContentLength="3222274048"' .artifacts/task15-host/web.config
          if grep -Eiq 'https?://(fonts|cdn|unpkg|jsdelivr|cdnjs)\.' .artifacts/task15-host/wwwroot/index.html; then
            echo "Runtime Internet dependency found in published index.html."
            exit 1
          fi
