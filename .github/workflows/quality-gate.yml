name: MAVI Quality Gate

on:
  pull_request:
    branches:
      - main
      - feature/visual-intelligence-memory
      - feature/task-10-rtmdet-bytetrack
  push:
    branches:
      - main
      - feature/visual-intelligence-memory
      - feature/task-10-rtmdet-bytetrack

permissions:
  contents: read

concurrency:
  group: mavi-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVI_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  repo-contracts:
    name: repo contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            src/vision/pyproject.toml
            tools/requirements.txt
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/vision[dev]' -r tools/requirements.txt
      - name: Verify repository
        run: python tools/verify_repo.py
      - name: Test Task 17 acceptance tooling
        run: python -m pytest -q tools/phase1/tests
      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          if sudo apt-get install -y ffmpeg; then
            exit 0
          fi
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*' -delete
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg
      - name: Test Stage 3 measurement tooling
        # The S3.2b media tests build a throwaway pack around this FFmpeg; they must run, never skip, here.
        env:
          MAVI_REQUIRE_MEDIA_TESTS: '1'
        run: python -m pytest -q tools/stage3/tests
      - name: Test benchmark harness
        # The synthetic end-to-end benchmark encodes MP4s with a pack built around this FFmpeg: run, never skip.
        env:
          MAVI_REQUIRE_MEDIA_TESTS: '1'
        run: python -m pytest -q tools/benchmarks/tests

  dotnet-tests:
    name: dotnet shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mavi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mavi_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      MAVI_TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=mavi_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/vision/pyproject.toml
      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          if sudo apt-get install -y ffmpeg; then
            exit 0
          fi
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*' -delete
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg
      - name: Install Python worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/vision[dev]'
      - name: Build .NET
        run: dotnet build MAVI.sln --configuration Release
      - name: Test .NET shard
        shell: bash
        env:
          MAVI_S2B_WORKER_PYTHON: python
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '3'
        run: |
          set -euo pipefail
          mapfile -t projects < <(dotnet sln MAVI.sln list | grep '^tests/' | sort)
          selected=()
          for i in "${!projects[@]}"; do
            if (( i % SHARD_COUNT == SHARD_INDEX )); then
              selected+=("${projects[$i]}")
            fi
          done
          test "${#selected[@]}" -gt 0
          status=0
          for project in "${selected[@]}"; do
            name="$(basename "$project" .csproj)"
            dotnet test "$project" --configuration Release --no-build --logger "trx;LogFileName=${name}.trx" --results-directory qualification-evidence/trx || status=1
          done
          exit "$status"
      # The lane artifact keeps the qualification-evidence/ root, so it holds
      # trx/<Project>.trx exactly as the canonical artifact below does.
      - name: Retain .NET results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-lane-dotnet-${{ matrix.shard }}
          path: qualification-evidence/
          include-hidden-files: false
          if-no-files-found: warn

  python-vision:
    name: python vision
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            src/vision/pyproject.toml
            tools/requirements.txt
      - name: Install vision dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/vision[dev]' -r tools/requirements.txt
      - name: Test Python contracts
        working-directory: src/vision
        run: python -m pytest -q

  guard-coverage:
    name: guard coverage shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            src/vision/pyproject.toml
            tools/requirements.txt
      - name: Install vision dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/vision[dev]' -r tools/requirements.txt
      - name: Check evidence-assembler guard coverage shard
        run: >-
          python tools/vision/check_guard_coverage.py
          --shard-index ${{ matrix.shard }}
          --shard-count 4

  qualification-tests:
    name: qualification shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            src/vision/pyproject.toml
            tools/requirements.txt
      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/vision[dev]' -r tools/requirements.txt
      # Test-level sharding (as in Qualification Tooling Windows): the suite's
      # cost sits in a few files, so whole files cannot balance. Every collected
      # test runs in exactly one shard (collection order, index modulo shard
      # count); a collection error, an empty collection or an empty shard fails.
      - name: Test qualification shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '4'
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q -p no:cacheprovider tools/qualification/tests > collected.txt
          grep '::' collected.txt > all-tests.txt
          total="$(wc -l < all-tests.txt)"
          test "$total" -gt 0
          awk -v n="$SHARD_COUNT" -v i="$SHARD_INDEX" '(NR - 1) % n == i' all-tests.txt > shard-tests.txt
          selected="$(wc -l < shard-tests.txt)"
          test "$selected" -gt 0
          echo "shard $SHARD_INDEX/$SHARD_COUNT runs $selected of $total collected tests"
          python -m pytest -q -rs -p no:cacheprovider @shard-tests.txt

  web-host:
    name: web and production host
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/mavi-web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install frontend dependencies
        working-directory: src/web/mavi-web
        run: npm ci
      - name: Test frontend
        working-directory: src/web/mavi-web
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=../../../qualification-evidence/junit/mavi-web.xml
      - name: Typecheck frontend
        working-directory: src/web/mavi-web
        run: npm run typecheck
      - name: Build frontend
        working-directory: src/web/mavi-web
        run: npm run build
      - name: Restore production web host
        run: dotnet restore src/platform/Mavi.Api/Mavi.Api.csproj
      - name: Publish production web host
        run: >-
          dotnet publish src/platform/Mavi.Api/Mavi.Api.csproj
          --configuration Release
          --no-restore
          -p:RequireMaviBundledMediaTools=false
          -p:MaviBuild=github-${{ github.run_id }}-${{ github.run_attempt }}
          -p:MaviCommit=${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          --output .artifacts/task15-host
      - name: Verify production web host composition
        shell: bash
        run: |
          set -euo pipefail
          test -f .artifacts/task15-host/Mavi.Api.dll
          test -f .artifacts/task15-host/web.config
          test -f .artifacts/task15-host/wwwroot/index.html
          test -d .artifacts/task15-host/wwwroot/assets
          grep -q 'maxAllowedContentLength="3222274048"' .artifacts/task15-host/web.config
          if grep -Eiq 'https?://(fonts|cdn|unpkg|jsdelivr|cdnjs)\.' .artifacts/task15-host/wwwroot/index.html; then
            echo "Runtime Internet dependency found in published index.html."
            exit 1
          fi
      - name: Retain web results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-lane-web
          path: qualification-evidence/
          include-hidden-files: false
          if-no-files-found: warn

  visual-qa:
    # Stage 3.5 S2 (specification §26 as amended, register V4): the visual-QA
    # harness against the production build at every tier anchor. The job fails
    # only on a `blocking` manifest finding (exit 1) or a harness fault (exit
    # 2); `measured/pending` findings are printed and kept in results.json.
    # It builds the frontend itself rather than waiting on web-host's build: the
    # Vite build takes seconds, and depending on that lane would serialise this
    # job behind its .NET publish for no isolation gain.
    name: visual QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/mavi-web/package-lock.json
      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          "$browser" --version
          echo "MAVI_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          if sudo apt-get install -y ffmpeg; then
            exit 0
          fi
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*' -delete
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg
      - name: Install frontend dependencies
        working-directory: src/web/mavi-web
        run: npm ci
      - name: Build frontend (production)
        working-directory: src/web/mavi-web
        run: npm run build
      - name: Test the harness
        run: node --test 'tools/web-visual-qa/test/*.test.mjs'
      - name: Run the visual-QA sweep
        run: node tools/web-visual-qa/run.mjs --workers 3
      - name: Retain captures and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-captures
          path: tools/web-visual-qa/.captures/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  quality:
    name: quality
    if: always()
    needs:
      - repo-contracts
      - dotnet-tests
      - python-vision
      - guard-coverage
      - qualification-tests
      - web-host
      - visual-qa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # S1.4 Harness A: the lanes' TRX and JUnit files are re-published as the one
      # canonical quality-gate-test-results artifact (trx/<Project>.trx,
      # junit/mavi-web.xml) of this run, at the exact head every lane verified.
      - uses: actions/checkout@v4
        if: always()
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: tests
      - name: Verify exact checked-out source head
        if: always()
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - name: Collect lane test results
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: quality-lane-*
          path: qualification-evidence/
          merge-multiple: true
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-test-results
          path: qualification-evidence/
          include-hidden-files: false
          if-no-files-found: warn
      - name: Require every quality lane
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.repo-contracts.result }}' = 'success'
          test '${{ needs.dotnet-tests.result }}' = 'success'
          test '${{ needs.python-vision.result }}' = 'success'
          test '${{ needs.guard-coverage.result }}' = 'success'
          test '${{ needs.qualification-tests.result }}' = 'success'
          test '${{ needs.web-host.result }}' = 'success'
          test '${{ needs.visual-qa.result }}' = 'success'
      - name: Require one TRX per test project and the web JUnit
        shell: bash
        run: |
          set -euo pipefail
          expected="$(find tests -mindepth 2 -maxdepth 2 -name '*.csproj' -exec basename {} .csproj \; | sort)"
          actual="$(find qualification-evidence/trx -maxdepth 1 -name '*.trx' -exec basename {} .trx \; | sort)"
          test -n "$expected"
          if [ "$expected" != "$actual" ]; then
            echo "retained TRX set differs from the test projects"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          test -s qualification-evidence/junit/mavi-web.xml
