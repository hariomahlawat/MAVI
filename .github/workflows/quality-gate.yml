name: MAVI Quality Gate

# The one required check is the aggregate job `quality` (branch protection;
# docs/runbooks/ci-checks-and-merge-gates.md). The workflow runs on every pull
# request so that check always reports; the `scope` job then decides, from the
# pull request's merge diff (tools/ci/quality_scope.py, tools/ci/quality-scope.json),
# which lanes the change can reach, and only those run. `quality` requires every
# applicable lane to have succeeded and every non-applicable lane to have been
# skipped — any other state fails it. A push to a gated branch runs every lane.

on:
  pull_request:
    branches:
      - main
      - feature/visual-intelligence-memory
      - feature/task-10-rtmdet-bytetrack
  push:
    branches:
      - main
      - feature/visual-intelligence-memory
      - feature/task-10-rtmdet-bytetrack

permissions:
  contents: read

# A newer head of the same pull request supersedes the run in progress (one
# group per pull-request ref). A push to a gated branch gets a group of its own
# (the run id), so it is neither cancelled nor queued behind another push: the
# evidence on `main` for one merge commit is never lost to the next.
concurrency:
  group: mavi-quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAVI_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  scope:
    name: quality scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tooling: ${{ steps.scope.outputs.tooling }}
      dotnet: ${{ steps.scope.outputs.dotnet }}
      vision: ${{ steps.scope.outputs.vision }}
      guard: ${{ steps.scope.outputs.guard }}
      qualification: ${{ steps.scope.outputs.qualification }}
      web: ${{ steps.scope.outputs.web }}
      visual: ${{ steps.scope.outputs.visual }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Decide which lanes the change reaches
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          every() { for lane in tooling dotnet vision guard qualification web visual; do echo "$lane=true"; done; }
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "quality-scope: ${{ github.event_name }} event; running every lane" >&2
            every | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$RUNNER_TEMP/quality-changed-paths"
          # The merge commit's first parent is the base branch, so this is exactly
          # what merging changes. --no-renames lists both paths of a rename.
          if test "$(git rev-parse HEAD)" = "$GITHUB_SHA" \
              && git rev-parse --verify --quiet 'HEAD^2' >/dev/null \
              && git diff --no-renames --name-only -z 'HEAD^1' HEAD > "$changed"; then
            python3 tools/ci/quality_scope.py lanes --files "$changed" | tee -a "$GITHUB_OUTPUT"
          else
            echo "quality-scope: merge commit diff unavailable; running every lane" >&2
            every | tee -a "$GITHUB_OUTPUT"
          fi

  repo-contracts:
    # Always: the repository's own contracts cover documents, configuration and
    # workflows as much as code, and the scope classifier's tests run here.
    name: repo contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            src/vision/pyproject.toml
            tools/requirements.txt
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/vision[dev]' -r tools/requirements.txt
      - name: Verify repository
        run: python tools/verify_repo.py
      - name: Test the quality scope classifier
        run: python -m pytest -q tools/ci/tests

  tooling-tests:
    name: tooling tests
    needs: scope
    if: needs.scope.outputs.tooling != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            src/vision/pyproject.toml
            tools/requirements.txt
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/vision[dev]' -r tools/requirements.txt
      - name: Test Task 17 acceptance tooling
        run: python -m pytest -q tools/phase1/tests
      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          if sudo apt-get install -y ffmpeg; then
            exit 0
          fi
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*' -delete
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg
      - name: Test Stage 3 measurement tooling
        # The S3.2b media tests build a throwaway pack around this FFmpeg; they must run, never skip, here.
        env:
          MAVI_REQUIRE_MEDIA_TESTS: '1'
        run: python -m pytest -q tools/stage3/tests
      - name: Test benchmark harness
        # The synthetic end-to-end benchmark encodes MP4s with a pack built around this FFmpeg: run, never skip.
        env:
          MAVI_REQUIRE_MEDIA_TESTS: '1'
        run: python -m pytest -q tools/benchmarks/tests

  dotnet-tests:
    name: dotnet shard ${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.dotnet != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mavi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mavi_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      MAVI_TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=mavi_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/vision/pyproject.toml
      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          if sudo apt-get install -y ffmpeg; then
            exit 0
          fi
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*' -delete
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg
      - name: Install Python worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/vision[dev]'
      - name: Build .NET
        run: dotnet build MAVI.sln --configuration Release
      - name: Test .NET shard
        shell: bash
        env:
          MAVI_S2B_WORKER_PYTHON: python
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '3'
        run: |
          set -euo pipefail
          mapfile -t projects < <(dotnet sln MAVI.sln list | grep '^tests/' | sort)
          selected=()
          for i in "${!projects[@]}"; do
            if (( i % SHARD_COUNT == SHARD_INDEX )); then
              selected+=("${projects[$i]}")
            fi
          done
          test "${#selected[@]}" -gt 0
          status=0
          for project in "${selected[@]}"; do
            name="$(basename "$project" .csproj)"
            dotnet test "$project" --configuration Release --no-build --logger "trx;LogFileName=${name}.trx" --results-directory qualification-evidence/trx || status=1
          done
          exit "$status"
      # The lane artifact keeps the qualification-evidence/ root, so it holds
      # trx/<Project>.trx exactly as the canonical artifact below does.
      - name: Retain .NET results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-lane-dotnet-${{ matrix.shard }}
          path: qualification-evidence/
          include-hidden-files: false
          if-no-files-found: warn

  python-vision:
    name: python vision
    needs: scope
    if: needs.scope.outputs.vision != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            src/vision/pyproject.toml
            tools/requirements.txt
      - name: Install vision dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/vision[dev]' -r tools/requirements.txt
      - name: Test Python contracts
        working-directory: src/vision
        run: python -m pytest -q

  guard-coverage:
    name: guard coverage shard ${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.guard != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            src/vision/pyproject.toml
            tools/requirements.txt
      - name: Install vision dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/vision[dev]' -r tools/requirements.txt
      - name: Check evidence-assembler guard coverage shard
        run: >-
          python tools/vision/check_guard_coverage.py
          --shard-index ${{ matrix.shard }}
          --shard-count 4

  qualification-tests:
    name: qualification shard ${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.qualification != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            src/vision/pyproject.toml
            tools/requirements.txt
      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './src/vision[dev]' -r tools/requirements.txt
      # Test-level sharding (as in Qualification Tooling Windows): the suite's
      # cost sits in a few files, so whole files cannot balance. Every collected
      # test runs in exactly one shard (collection order, index modulo shard
      # count); a collection error, an empty collection or an empty shard fails.
      - name: Test qualification shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '4'
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q -p no:cacheprovider tools/qualification/tests > collected.txt
          grep '::' collected.txt > all-tests.txt
          total="$(wc -l < all-tests.txt)"
          test "$total" -gt 0
          awk -v n="$SHARD_COUNT" -v i="$SHARD_INDEX" '(NR - 1) % n == i' all-tests.txt > shard-tests.txt
          selected="$(wc -l < shard-tests.txt)"
          test "$selected" -gt 0
          echo "shard $SHARD_INDEX/$SHARD_COUNT runs $selected of $total collected tests"
          python -m pytest -q -rs -p no:cacheprovider @shard-tests.txt

  web-host:
    name: web and production host
    needs: scope
    if: needs.scope.outputs.web != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/mavi-web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install frontend dependencies
        working-directory: src/web/mavi-web
        run: npm ci
      - name: Test frontend
        working-directory: src/web/mavi-web
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=../../../qualification-evidence/junit/mavi-web.xml
      - name: Typecheck frontend
        working-directory: src/web/mavi-web
        run: npm run typecheck
      - name: Build frontend
        working-directory: src/web/mavi-web
        run: npm run build
      - name: Restore production web host
        run: dotnet restore src/platform/Mavi.Api/Mavi.Api.csproj
      - name: Publish production web host
        run: >-
          dotnet publish src/platform/Mavi.Api/Mavi.Api.csproj
          --configuration Release
          --no-restore
          -p:RequireMaviBundledMediaTools=false
          -p:MaviBuild=github-${{ github.run_id }}-${{ github.run_attempt }}
          -p:MaviCommit=${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          --output .artifacts/task15-host
      - name: Verify production web host composition
        shell: bash
        run: |
          set -euo pipefail
          test -f .artifacts/task15-host/Mavi.Api.dll
          test -f .artifacts/task15-host/web.config
          test -f .artifacts/task15-host/wwwroot/index.html
          test -d .artifacts/task15-host/wwwroot/assets
          grep -q 'maxAllowedContentLength="3222274048"' .artifacts/task15-host/web.config
          if grep -Eiq 'https?://(fonts|cdn|unpkg|jsdelivr|cdnjs)\.' .artifacts/task15-host/wwwroot/index.html; then
            echo "Runtime Internet dependency found in published index.html."
            exit 1
          fi
      - name: Retain web results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-lane-web
          path: qualification-evidence/
          include-hidden-files: false
          if-no-files-found: warn

  visual-harness-tests:
    # Stage 3.5 S2 (specification §26 as amended, register V4): the harness's
    # own tests, in four concurrent groups — the unit tests in one, the
    # end-to-end runs of run.mjs (the T3 zoom negatives among them) in three,
    # each run in exactly one group (test/browser.mjs testGroup). Every group
    # builds the production bundle itself: the Vite build takes seconds and an
    # artifact hand-off would cost more than it saves.
    name: visual harness ${{ matrix.group }}
    needs: scope
    if: needs.scope.outputs.visual != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [unit, e2e-0/3, e2e-1/3, e2e-2/3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/mavi-web/package-lock.json
      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          "$browser" --version
          echo "MAVI_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          if sudo apt-get install -y ffmpeg; then
            exit 0
          fi
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*' -delete
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg
      - name: Install frontend dependencies
        working-directory: src/web/mavi-web
        run: npm ci
      - name: Build frontend (production)
        working-directory: src/web/mavi-web
        run: npm run build
      - name: Test the harness (unit group)
        if: matrix.group == 'unit'
        env:
          MAVI_VQA_TEST_GROUP: unit
        run: node --test 'tools/web-visual-qa/test/*.test.mjs'
      - name: Test the harness (end-to-end group)
        if: matrix.group != 'unit'
        env:
          MAVI_VQA_TEST_GROUP: ${{ matrix.group }}
        run: node --test tools/web-visual-qa/test/zoom.test.mjs tools/web-visual-qa/test/run.test.mjs tools/web-visual-qa/test/shard.test.mjs tools/web-visual-qa/test/a11y.test.mjs tools/web-visual-qa/test/motion.test.mjs

  visual-sweep:
    # The full sweep at every tier anchor, against the production build, in
    # four deterministic shards of the one plan (run.mjs --shard i/n: a state
    # and its loading-pair partner in one shard). A shard judges each case it
    # runs; the aggregate below proves the plan ran exactly once and applies
    # the sweep-wide checks. A shard fails only on a `blocking` finding (exit
    # 1) or a harness fault (exit 2) in its own cases.
    name: visual sweep shard ${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.visual != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_COUNT: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/mavi-web/package-lock.json
      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          "$browser" --version
          echo "MAVI_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          if sudo apt-get install -y ffmpeg; then
            exit 0
          fi
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*' -delete
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg
      - name: Install frontend dependencies
        working-directory: src/web/mavi-web
        run: npm ci
      - name: Build frontend (production)
        working-directory: src/web/mavi-web
        run: npm run build
      - name: Run the visual-QA sweep shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: node tools/web-visual-qa/run.mjs --workers 3 --shard "$SHARD_INDEX/$SHARD_COUNT"
      # The shard's results (small) for the aggregate; its captures (diagnostic,
      # never qualification evidence) for a person to read.
      - name: Retain shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-shard-results-${{ matrix.shard }}
          path: tools/web-visual-qa/.captures/results.json
          retention-days: 14
          if-no-files-found: error
      - name: Retain shard captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-captures-shard-${{ matrix.shard }}
          path: tools/web-visual-qa/.captures/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  visual-aggregate:
    # The full sweep's verdict from its shards (aggregate.mjs): the same head,
    # manifest and plan in every shard; every planned case run exactly once,
    # reached and valid; no harness error; the sweep-wide checks (every surface
    # judged at 200%, no blocking rule unevaluated, overlay restoration at Tier
    # A, pressed treatments proven, loading Ledgers against their tables); no
    # blocking finding. Runs only when every shard succeeded; `quality` then
    # requires it.
    name: visual aggregate
    needs:
      - scope
      - visual-sweep
    if: needs.scope.outputs.visual != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect shard results
        uses: actions/download-artifact@v4
        with:
          pattern: visual-qa-shard-results-*
          path: visual-shards/
      - name: Aggregate the sweep
        shell: bash
        env:
          SHARD_COUNT: '4'
        run: |
          set -euo pipefail
          mapfile -t files < <(find visual-shards -name results.json | sort)
          test "${#files[@]}" = "$SHARD_COUNT"
          for f in "${files[@]}"; do
            test "$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).head))' "$f")" = "$MAVI_EXPECTED_SOURCE_SHA"
          done
          node tools/web-visual-qa/aggregate.mjs --out tools/web-visual-qa/.captures "${files[@]}"
          # The aggregate must be the full sweep, not a partial selection.
          test "$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("tools/web-visual-qa/.captures/results.json","utf8")).fullSweep))')" = 'true'
      - name: Retain the aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-captures
          path: tools/web-visual-qa/.captures/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  keyboard-journeys:
    # Stage 3.5 S6/X2 (§23, plan §5.3): the six frozen operator journeys,
    # keyboard-only, at the workstation compositions (Tier A 1366x768, Tier B
    # 1024x768 and 768x1024; Tier C claims no workflow) — 18 executions in
    # three deterministic shards of the one plan (journeys.mjs --shard i/n:
    # execution k in shard k mod n). A shard fails on a failed journey (exit
    # 1) or a harness fault (exit 2); the aggregate below proves the plan ran
    # exactly once.
    name: keyboard journeys shard ${{ matrix.shard }}
    needs: scope
    if: needs.scope.outputs.visual != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARD_COUNT: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/mavi-web/package-lock.json
      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          "$browser" --version
          echo "MAVI_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          if sudo apt-get install -y ffmpeg; then
            exit 0
          fi
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*' -delete
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg
      - name: Install frontend dependencies
        working-directory: src/web/mavi-web
        run: npm ci
      - name: Build frontend (production)
        working-directory: src/web/mavi-web
        run: npm run build
      - name: Run the keyboard-journey shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: node tools/web-visual-qa/journeys.mjs --workers 2 --shard "$SHARD_INDEX/$SHARD_COUNT" --out tools/web-visual-qa/.journeys
      # The shard's step evidence (journeys.json) for the aggregate, and with
      # any failure's capture for a person to read — diagnostic, never
      # qualification evidence.
      - name: Retain shard journeys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-journey-results-${{ matrix.shard }}
          path: |
            tools/web-visual-qa/.journeys/journeys.json
            tools/web-visual-qa/.journeys/*.png
          # .journeys is a dot directory: upload-artifact skips it otherwise.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  keyboard-journeys-aggregate:
    # X2's verdict from its shards (journeys.mjs --aggregate): every shard at
    # this head, the registry's whole plan (6 journeys x 3 viewports), each
    # execution exactly once, none at Tier C, every pass carrying its evidence
    # (keys alone, one document, the terminal checkpoint), no harness error.
    name: keyboard journeys aggregate
    needs:
      - scope
      - keyboard-journeys
    if: needs.scope.outputs.visual != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect shard journeys
        uses: actions/download-artifact@v4
        with:
          pattern: keyboard-journey-results-*
          path: journey-shards/
      - name: Aggregate the journeys
        shell: bash
        env:
          SHARD_COUNT: '3'
        run: |
          set -euo pipefail
          mapfile -t files < <(find journey-shards -name journeys.json | sort)
          test "${#files[@]}" = "$SHARD_COUNT"
          for f in "${files[@]}"; do
            test "$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).head))' "$f")" = "$MAVI_EXPECTED_SOURCE_SHA"
          done
          node tools/web-visual-qa/journeys.mjs --aggregate --out tools/web-visual-qa/.journeys "${files[@]}"
      - name: Retain the aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-journeys
          path: tools/web-visual-qa/.journeys/journeys.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  performance:
    # Stage 3.5 S6/X3 (§38): the performance budgets, in their own job. Long
    # tasks are measured here on ONE lane (run.mjs --long-tasks: every state
    # that declares an operator interaction, at its ordinary anchors and
    # probes), never in the sweep's contended lanes; the sweep's ordinary
    # cases supply navigation and preparation CLS and the resolved fonts.
    # A failure here is the performance gate's own, required by quality.
    name: performance budgets
    needs: scope
    if: needs.scope.outputs.visual != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source head
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/mavi-web/package-lock.json
      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          "$browser" --version
          echo "MAVI_CHROMIUM=$browser" >> "$GITHUB_ENV"
      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          if sudo apt-get install -y ffmpeg; then
            exit 0
          fi
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*google*' -delete
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg
      - name: Install frontend dependencies
        working-directory: src/web/mavi-web
        run: npm ci
      - name: Build frontend (production)
        working-directory: src/web/mavi-web
        run: npm run build
      - name: Run the long-task lane (one worker)
        env:
          MAVI_VQA_OUT: tools/web-visual-qa/.performance/long-tasks
        run: node tools/web-visual-qa/run.mjs --long-tasks
      # The lane's results (small), for the qualification and a person —
      # diagnostic, never qualification evidence by themselves.
      - name: Retain the performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-budgets
          path: |
            tools/web-visual-qa/.performance/long-tasks/results.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  quality:
    name: quality
    if: always()
    needs:
      - scope
      - repo-contracts
      - tooling-tests
      - dotnet-tests
      - python-vision
      - guard-coverage
      - qualification-tests
      - web-host
      - visual-harness-tests
      - visual-sweep
      - visual-aggregate
      - keyboard-journeys
      - keyboard-journeys-aggregate
      - performance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # S1.4 Harness A: the lanes' TRX and JUnit files are re-published as the one
      # canonical quality-gate-test-results artifact (trx/<Project>.trx,
      # junit/mavi-web.xml) of this run, at the exact head every lane verified.
      - uses: actions/checkout@v4
        if: always()
        with:
          ref: ${{ env.MAVI_EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: tests
      - name: Verify exact checked-out source head
        if: always()
        run: test "$(git rev-parse HEAD)" = "$MAVI_EXPECTED_SOURCE_SHA"
      - name: Collect lane test results
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: quality-lane-*
          path: qualification-evidence/
          merge-multiple: true
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-test-results
          path: qualification-evidence/
          include-hidden-files: false
          if-no-files-found: warn
      # Every lane is accounted for: an applicable lane must have succeeded, a
      # non-applicable one must have been skipped by the scope decision, and
      # anything else — failed, cancelled, missing — fails the gate. The scope
      # job itself must have succeeded, and repo-contracts always applies.
      - name: Require every quality lane
        shell: bash
        run: |
          set -euo pipefail
          require() {
            job="$1"; result="$2"; applicable="$3"
            if [ "$applicable" = 'false' ]; then
              if [ "$result" != 'skipped' ]; then echo "$job: not applicable to this change, but its result is '$result' (expected skipped)"; exit 1; fi
              echo "$job: not applicable (skipped)"
            else
              if [ "$result" != 'success' ]; then echo "$job: applicable, but its result is '$result' (expected success)"; exit 1; fi
              echo "$job: success"
            fi
          }
          test '${{ needs.scope.result }}' = 'success'
          require repo-contracts '${{ needs.repo-contracts.result }}' true
          require tooling-tests '${{ needs.tooling-tests.result }}' '${{ needs.scope.outputs.tooling }}'
          require dotnet-tests '${{ needs.dotnet-tests.result }}' '${{ needs.scope.outputs.dotnet }}'
          require python-vision '${{ needs.python-vision.result }}' '${{ needs.scope.outputs.vision }}'
          require guard-coverage '${{ needs.guard-coverage.result }}' '${{ needs.scope.outputs.guard }}'
          require qualification-tests '${{ needs.qualification-tests.result }}' '${{ needs.scope.outputs.qualification }}'
          require web-host '${{ needs.web-host.result }}' '${{ needs.scope.outputs.web }}'
          require visual-harness-tests '${{ needs.visual-harness-tests.result }}' '${{ needs.scope.outputs.visual }}'
          require visual-sweep '${{ needs.visual-sweep.result }}' '${{ needs.scope.outputs.visual }}'
          require visual-aggregate '${{ needs.visual-aggregate.result }}' '${{ needs.scope.outputs.visual }}'
          require keyboard-journeys '${{ needs.keyboard-journeys.result }}' '${{ needs.scope.outputs.visual }}'
          require keyboard-journeys-aggregate '${{ needs.keyboard-journeys-aggregate.result }}' '${{ needs.scope.outputs.visual }}'
          require performance '${{ needs.performance.result }}' '${{ needs.scope.outputs.visual }}'
      - name: Require one TRX per test project and the web JUnit
        shell: bash
        env:
          DOTNET_APPLICABLE: ${{ needs.scope.outputs.dotnet }}
          WEB_APPLICABLE: ${{ needs.scope.outputs.web }}
        run: |
          set -euo pipefail
          if [ "$DOTNET_APPLICABLE" != 'false' ]; then
            expected="$(find tests -mindepth 2 -maxdepth 2 -name '*.csproj' -exec basename {} .csproj \; | sort)"
            actual="$(find qualification-evidence/trx -maxdepth 1 -name '*.trx' -exec basename {} .trx \; | sort)"
            test -n "$expected"
            if [ "$expected" != "$actual" ]; then
              echo "retained TRX set differs from the test projects"
              diff <(echo "$expected") <(echo "$actual") || true
              exit 1
            fi
          else
            echo "dotnet lane not applicable: no TRX expected"
          fi
          if [ "$WEB_APPLICABLE" != 'false' ]; then
            test -s qualification-evidence/junit/mavi-web.xml
          else
            echo "web lane not applicable: no JUnit expected"
          fi
