name: DIAG Task 12 Windows MMCV reproducibility (temporary)

# Temporary investigation workflow; removed before the fix PR is final.
on:
  push:
    branches:
      - fix/task12-windows-mmcv-reproducibility
    paths:
      - '.github/workflows/diag-task12-windows-mmcv.yml'

permissions:
  contents: read

jobs:
  fixed-toolset-probe:
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - vs: '17.14.39'
            url: 'https://download.visualstudio.microsoft.com/download/pr/fa619120-9c0e-47e6-bfe0-3ee96fb671b2/236367b68ba9a51708263ab10a1c85546cc4a8eca78b365168811d19c4fb2f29/vs_BuildTools.exe'
            sha: '236367b68ba9a51708263ab10a1c85546cc4a8eca78b365168811d19c4fb2f29'
          - vs: '17.14.40'
            url: 'https://download.visualstudio.microsoft.com/download/pr/f8d58e41-102a-4347-a567-60d7235da3b5/aac092d0d839fd078e86b301d886130f1605891061242b36facf55ccbdd5a0a7/vs_BuildTools.exe'
            sha: 'aac092d0d839fd078e86b301d886130f1605891061242b36facf55ccbdd5a0a7'
          - vs: '17.14.41'
            url: 'https://download.visualstudio.microsoft.com/download/pr/bc92e2cb-33de-4a0c-995d-efa817f16b16/37bb0fb429d163ecebd272a865d11a37b906d152bef960da2ddb29c2e2fd6eeb/vs_BuildTools.exe'
            sha: '37bb0fb429d163ecebd272a865d11a37b906d152bef960da2ddb29c2e2fd6eeb'
    env:
      MMCV_WITH_OPS: '1'
      MAX_JOBS: '2'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
      SOURCE_DATE_EPOCH: '1704067200'
    steps:
      - name: Install fixed-version Build Tools ${{ matrix.vs }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & curl.exe --fail --location --retry 3 --output vs_BuildTools.exe "${{ matrix.url }}"
          $h = (Get-FileHash vs_BuildTools.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "bootstrapper sha256 $h"
          if ($h -ne "${{ matrix.sha }}") { throw "bootstrapper_sha_mismatch" }
          $sig = Get-AuthenticodeSignature vs_BuildTools.exe
          "signature $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "bootstrapper_signature_invalid" }
          $p = Start-Process -FilePath .\vs_BuildTools.exe -Wait -PassThru -ArgumentList @(
            "--quiet", "--wait", "--norestart", "--nocache",
            "--installPath", "C:\BT",
            "--add", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.Windows11SDK.26100")
          "installer exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "install_failed" }
          Get-ChildItem C:\BT\VC\Tools\MSVC -Directory | ForEach-Object {
            $cl = Join-Path $_.FullName "bin\Hostx64\x64\cl.exe"
            "toolset {0} cl={1} link={2}" -f $_.Name, (Get-Item $cl).VersionInfo.FileVersion, (Get-Item (Join-Path $_.FullName "bin\Hostx64\x64\link.exe")).VersionInfo.FileVersion
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install connected build tooling (identical to Task 12)
        run: >-
          python -m pip install
          "pip==26.2.1" "setuptools==80.9.0" "wheel==0.48.0" "ninja==1.13.2"
          "psutil==7.2.2" "packaging==26.3" "numpy==2.5.3" "pydantic==2.13.5"
          "pydantic-core==2.46.5" "annotated-types==0.8.0" "typing-extensions==4.16.0"
          "typing-inspection==0.4.4"
      - name: Install exact CPU PyTorch (identical to Task 12)
        run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Enter the fixed-version toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcvars = "C:\BT\VC\Auxiliary\Build\vcvarsall.bat"
          $lines = & cmd.exe /c "`"$vcvars`" x64 10.0.26100.0 -vcvars_ver=14.44 >NUL && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars_failed" }
          foreach ($line in $lines) {
            $i = $line.IndexOf("=")
            if ($i -gt 0) { "{0}={1}" -f $line.Substring(0, $i), $line.Substring($i + 1) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
          "DISTUTILS_USE_SDK=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSSdk=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CL=/Brepro" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LINK=/Brepro" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Checkout immutable MMCV 2.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          git init .task12-mmcv
          git -C .task12-mmcv remote add origin https://github.com/open-mmlab/mmcv.git
          git -C .task12-mmcv fetch --depth 1 origin 57c4e25e06e2d4f8a9357c84bcd24089a284dc88
          git -C .task12-mmcv checkout --detach FETCH_HEAD
      - name: Build MMCV with Build Tools ${{ matrix.vs }}
        working-directory: .task12-mmcv
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          "VCToolsInstallDir=$env:VCToolsInstallDir VSCMD_VER=$env:VSCMD_VER"
          (Get-Command cl.exe).Source
          & cl.exe 2>&1 | Select-Object -First 1
          python -m pip wheel --no-build-isolation --no-deps . -w ../probe-out *> ../probe.log
          if ($LASTEXITCODE -ne 0) { Get-Content ../probe.log -Tail 40; throw "build_failed" }
          $h = (Get-FileHash (Get-ChildItem ../probe-out/*.whl).FullName).Hash.ToLowerInvariant()
          "probe ${{ matrix.vs }} mmcv sha256 $h"
          if ($h -eq "f1f0a6c94fcbf91f1298e8038ea07a22a5f3a8ed0551103f58ecc5b1d608d2c8") { "MATCHES-COMMITTED-LOCK" }
          elseif ($h -eq "4422ec501a669e43aecd997f883221ca0d75742d387dae9ce5fada2cd5a80cd2") { "MATCHES-CURRENT-IMAGE-BUILD" }
          else { "MATCHES-NEITHER" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.vs }}
          path: probe-out
          retention-days: 7
  vs-instances:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Enumerate VS instances and their 14.44 compilers
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          "ImageVersion=$env:ImageVersion"
          & $vswhere -all -prerelease -products * -format json | Out-File vs.json -Encoding utf8
          $instances = Get-Content vs.json -Raw | ConvertFrom-Json
          foreach ($i in $instances) {
            "== instance {0} {1} {2} {3}" -f $i.instanceId, $i.installationVersion, $i.catalog.productDisplayVersion, $i.installationPath
            $msvc = Join-Path $i.installationPath "VC\Tools\MSVC"
            if (Test-Path $msvc) {
              Get-ChildItem $msvc -Directory | ForEach-Object {
                $cl = Join-Path $_.FullName "bin\Hostx64\x64\cl.exe"
                $c2 = Join-Path $_.FullName "bin\Hostx64\x64\c2.dll"
                $link = Join-Path $_.FullName "bin\Hostx64\x64\link.exe"
                if (Test-Path $cl) {
                  "   toolset {0} cl={1} c2={2} link={3} clsha={4}" -f $_.Name, (Get-Item $cl).VersionInfo.FileVersion, (Get-Item $c2).VersionInfo.FileVersion, (Get-Item $link).VersionInfo.FileVersion, (Get-FileHash $cl).Hash
                }
              }
            }
            $aux = Join-Path $i.installationPath "VC\Auxiliary\Build"
            Get-ChildItem $aux -Filter "Microsoft.VCToolsVersion*.txt" -ErrorAction SilentlyContinue | ForEach-Object { "   {0} = {1}" -f $_.Name, (Get-Content $_.FullName -Raw).Trim() }
          }
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Directory | ForEach-Object { "dir " + $_.FullName }
          Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio" -Directory -ErrorAction SilentlyContinue | ForEach-Object { "dir86 " + $_.FullName }
  build-twice:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      MMCV_WITH_OPS: '1'
      MAX_JOBS: '2'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
      SOURCE_DATE_EPOCH: '1704067200'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install connected build tooling (identical to Task 12)
        run: >-
          python -m pip install
          "pip==26.2.1" "setuptools==80.9.0" "wheel==0.48.0" "ninja==1.13.2"
          "psutil==7.2.2" "packaging==26.3" "numpy==2.5.3" "pydantic==2.13.5"
          "pydantic-core==2.46.5" "annotated-types==0.8.0" "typing-extensions==4.16.0"
          "typing-inspection==0.4.4"
      - name: Install exact CPU PyTorch (identical to Task 12)
        run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          toolset: "14.44"
          sdk: "10.0.26100.0"
          arch: x64
      - name: Reproducibility flags (identical to Task 12)
        shell: pwsh
        run: |
          "DISTUTILS_USE_SDK=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSSdk=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CL=/Brepro" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LINK=/Brepro" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Fingerprint toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "diag-out"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $f = "$out/toolchain.txt"
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion" | Out-File $f -Encoding utf8
          "VSCMD_VER=$env:VSCMD_VER VCToolsVersion=$env:VCToolsVersion WindowsSDKVersion=$env:WindowsSDKVersion UCRTVersion=$env:UCRTVersion" | Out-File $f -Append -Encoding utf8
          "VCToolsInstallDir=$env:VCToolsInstallDir" | Out-File $f -Append -Encoding utf8
          "VCToolsRedistDir=$env:VCToolsRedistDir" | Out-File $f -Append -Encoding utf8
          & cl.exe 2>&1 | Select-Object -First 2 | Out-File $f -Append -Encoding utf8
          & link.exe /? 2>&1 | Select-Object -First 2 | Out-File $f -Append -Encoding utf8
          $bin = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64"
          Get-ChildItem $bin -File -Include *.exe,*.dll -Recurse | Sort-Object FullName | ForEach-Object {
            "{0} {1} {2}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.VersionInfo.FileVersion, $_.FullName.Substring($bin.Length)
          } | Out-File "$out/msvc-bin.sha256" -Encoding utf8
          foreach ($sub in @("include", "lib\x64")) {
            $root = Join-Path $env:VCToolsInstallDir $sub
            Get-ChildItem $root -File -Recurse | Sort-Object FullName | ForEach-Object {
              "{0} {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.FullName.Substring($root.Length)
            } | Out-File ("$out/msvc-" + ($sub -replace '[\\]', '-') + ".sha256") -Encoding utf8
          }
          $sdkLib = "C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0"
          Get-ChildItem $sdkLib -File -Recurse -Include *.lib | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | ForEach-Object {
            "{0} {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.FullName.Substring($sdkLib.Length)
          } | Out-File "$out/sdk-lib-x64.sha256" -Encoding utf8
          Get-Content $f
      - name: Checkout immutable MMCV 2.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          git init .task12-mmcv
          git -C .task12-mmcv remote add origin https://github.com/open-mmlab/mmcv.git
          git -C .task12-mmcv fetch --depth 1 origin 57c4e25e06e2d4f8a9357c84bcd24089a284dc88
          git -C .task12-mmcv checkout --detach FETCH_HEAD
      - name: Build 1
        working-directory: .task12-mmcv
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip wheel --no-build-isolation --no-deps -v . -w ../diag-out/build1 *> ../diag-out/build1.log
          if ($LASTEXITCODE -ne 0) { Get-Content ../diag-out/build1.log -Tail 40; throw "build1 failed" }
          Get-FileHash ../diag-out/build1/*.whl
          New-Item -ItemType Directory ../diag-out/obj1 -Force | Out-Null
          Copy-Item -Recurse build/temp.* ../diag-out/obj1/
      - name: Build 2 (clean, same directory)
        working-directory: .task12-mmcv
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clean -xfdq
          python -m pip wheel --no-build-isolation --no-deps -v . -w ../diag-out/build2 *> ../diag-out/build2.log
          if ($LASTEXITCODE -ne 0) { Get-Content ../diag-out/build2.log -Tail 40; throw "build2 failed" }
          Get-FileHash ../diag-out/build2/*.whl
          New-Item -ItemType Directory ../diag-out/obj2 -Force | Out-Null
          Copy-Item -Recurse build/temp.* ../diag-out/obj2/
      - name: Compare builds on this runner
        shell: pwsh
        run: |
          $a = Get-FileHash (Get-ChildItem diag-out/build1/*.whl).FullName
          $b = Get-FileHash (Get-ChildItem diag-out/build2/*.whl).FullName
          "build1 $($a.Hash)"; "build2 $($b.Hash)"
          if ($a.Hash -eq $b.Hash) { "SAME-RUNNER-REPRODUCIBLE" } else { "SAME-RUNNER-DIFFERS" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-task12-windows-mmcv
          path: diag-out
          retention-days: 7
