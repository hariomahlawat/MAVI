name: Vision Runtime Component Boundary

on:
  pull_request:
    branches:
      - feature/task-10-rtmdet-bytetrack
    paths:
      - 'src/vision/pyproject.toml'
      - 'src/vision/mavi_vision/runtime/requirements_projection.py'
      - 'src/vision/mavi_vision/runtime/offline_lock.py'
      - 'src/vision/mavi_vision/runtime/component_identity.py'
      - 'src/vision/runtime/mmdetection-phase1-v1/*.lock'
      - 'src/vision/runtime/mmdetection-phase1-v1/runtime.json'
      - '.github/workflows/vision-runtime-component-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavi-runtime-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: windows-x86_64-cpu
            python-version: '3.12.10'
          - variant: linux-x86_64-cpu
            python-version: '3.12.14'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install boundary verification dependency
        run: python -m pip install 'packaging==26.3'

      - name: Generate canonical third-party lock candidate
        shell: bash
        env:
          MAVI_VARIANT: ${{ matrix.variant }}
          MAVI_TARGET_PYTHON: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          mkdir -p runtime-boundary
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          def load_module(name: str, path: str):
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise SystemExit(f"runtime_boundary_module_unloadable:{path}")
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              return module

          offline_lock = load_module(
              "_mavi_offline_lock",
              "src/vision/mavi_vision/runtime/offline_lock.py",
          )
          requirements_projection = load_module(
              "_mavi_requirements_projection",
              "src/vision/mavi_vision/runtime/requirements_projection.py",
          )

          variant = os.environ["MAVI_VARIANT"]
          python_version = os.environ["MAVI_TARGET_PYTHON"]
          tracked = Path("src/vision/runtime/mmdetection-phase1-v1") / f"{variant}.lock"
          current = offline_lock.load_offline_runtime_lock(tracked)
          filtered = offline_lock.OfflineRuntimeLock(
              schema_version=current.schema_version,
              platform_variant=current.platform_variant,
              python_version=current.python_version,
              distributions=tuple(
                  item for item in current.distributions if item.name != "mavi-vision"
              ),
          )
          candidate_bytes = offline_lock.serialize_offline_runtime_lock(filtered)
          candidate = Path("runtime-boundary") / f"{variant}.lock"
          candidate.write_bytes(candidate_bytes)

          projection = requirements_projection.build_runtime_requirements_projection(
              Path("src/vision/pyproject.toml"),
              platform_variant=variant,
              python_version=python_version,
          )
          runtime = json.loads(
              Path("src/vision/runtime/mmdetection-phase1-v1/runtime.json").read_text(
                  encoding="utf-8"
              )
          )
          platform = runtime["platformVariants"][variant]
          offline_lock.validate_offline_runtime_lock_for_runtime(
              filtered,
              expected_variant=variant,
              expected_python_version=python_version,
              semantic_graph=runtime["semanticGraph"],
              binary_versions=platform.get("binaryVersions"),
              platform_status=platform.get("status"),
              root_requirements=projection.requirements,
          )
          projection_path = Path("runtime-boundary") / f"{variant}.requirements.txt"
          projection_path.write_bytes(
              requirements_projection.serialize_runtime_requirements_projection(projection)
          )

          print("third-party-lock-sha256=" + hashlib.sha256(candidate_bytes).hexdigest())
          print(
              "runtime-requirements-sha256="
              + requirements_projection.runtime_requirements_sha256(projection)
          )
          PY

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-boundary-${{ matrix.variant }}-${{ github.sha }}
          path: runtime-boundary/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Enforce tracked third-party-only lock
        shell: bash
        env:
          MAVI_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if grep -q '^mavi-vision==' "src/vision/runtime/mmdetection-phase1-v1/$MAVI_VARIANT.lock"; then
            echo "Tracked runtime lock still contains first-party mavi-vision; use the uploaded canonical migration candidate." >&2
            exit 1
          fi
          cmp "runtime-boundary/$MAVI_VARIANT.lock" "src/vision/runtime/mmdetection-phase1-v1/$MAVI_VARIANT.lock"
