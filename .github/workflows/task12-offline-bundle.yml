name: Task 12 Offline Runtime Pack

on:
  push:
    branches:
      - feature/task-10-rtmdet-bytetrack
    paths:
      - 'tools/vision/build_runtime_pack.py'
      - 'tools/vision/freeze_offline_lock.py'
      - 'src/vision/mavi_vision/runtime/offline_lock.py'
      - 'src/vision/mavi_vision/runtime/requirements_projection.py'
      - 'src/vision/mavi_vision/runtime/component_identity.py'
      - 'src/vision/pyproject.toml'
      - 'src/vision/runtime/mmdetection-phase1-v1/**'
      - '.github/workflows/task12-offline-bundle.yml'
      - 'infrastructure/offline-bundle/**'
      - 'infrastructure/linux/**'
      - 'infrastructure/windows/**'
  pull_request:
    branches:
      - feature/task-10-rtmdet-bytetrack
    paths:
      - 'tools/vision/build_runtime_pack.py'
      - 'tools/vision/freeze_offline_lock.py'
      - 'src/vision/mavi_vision/runtime/offline_lock.py'
      - 'src/vision/mavi_vision/runtime/requirements_projection.py'
      - 'src/vision/mavi_vision/runtime/component_identity.py'
      - 'src/vision/pyproject.toml'
      - 'src/vision/runtime/mmdetection-phase1-v1/**'
      - '.github/workflows/task12-offline-bundle.yml'
      - 'infrastructure/offline-bundle/**'
      - 'infrastructure/linux/**'
      - 'infrastructure/windows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mavi-task12-runtime-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-runtime-pack:
    name: ${{ matrix.variant }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.12.14'
            variant: linux-x86_64-cpu
            native-abi: glibc-2.39-libstdcxx-GLIBCXX_3.4.33-gcc-14.2.0-linux_x86_64
          - os: windows-2025
            python-version: '3.12.10'
            variant: windows-x86_64-cpu
            native-abi: win_amd64-msvc-14.44-sdk-10.0.26100.0

    env:
      MMCV_WITH_OPS: '1'
      MAX_JOBS: '2'
      MAVI_RUNTIME_VARIANT: ${{ matrix.variant }}
      MAVI_PYTHON_VERSION: ${{ matrix.python-version }}
      MAVI_NATIVE_ABI: ${{ matrix.native-abi }}
      MAVI_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONHASHSEED: '0'
      SOURCE_DATE_EPOCH: '1704067200'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify exact checked-out source head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$MAVI_EXPECTED_SOURCE_SHA"
          echo "task12-source-head=$actual"

      - name: Install connected build tooling
        run: >-
          python -m pip install
          "pip==26.2.1"
          "setuptools==80.9.0"
          "wheel==0.48.0"
          "ninja==1.13.2"
          "psutil==7.2.2"
          "packaging==26.3"
          "numpy==2.5.3"
          "pydantic==2.13.5"
          "pydantic-core==2.46.5"
          "annotated-types==0.8.0"
          "typing-extensions==4.16.0"
          "typing-inspection==0.4.4"

      - name: Install exact CPU PyTorch build for MMCV compilation
        run: >-
          python -m pip install
          torch==2.6.0
          torchvision==0.21.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Configure qualified MSVC compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          toolset: "14.44"
          sdk: "10.0.26100.0"
          arch: x64

      - name: Verify qualified Windows native build identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:VCToolsVersion.StartsWith("14.44.")) {
            throw "unexpected_vctools_version:$env:VCToolsVersion"
          }
          $sdk = $env:WindowsSDKVersion.TrimEnd("\")
          if ($sdk -ne "10.0.26100.0") {
            throw "unexpected_windows_sdk:$sdk"
          }
          $cl = (Get-Command cl.exe).Source
          if ($cl -notmatch 'MSVC\\14\.44\.') {
            throw "unexpected_cl_path:$cl"
          }
          "DISTUTILS_USE_SDK=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSSdk=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CL=/Brepro" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LINK=/Brepro" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify qualified Linux native build identity
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test "$(uname -m)" = "x86_64"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.39"
          test "$(gcc-14 -dumpfullversion -dumpversion)" = "14.2.0"
          test "$(g++-14 -dumpfullversion -dumpversion)" = "14.2.0"
          libstdcpp="$(g++-14 -print-file-name=libstdc++.so.6)"
          max_glibcxx="$(strings "$libstdcpp" | grep -Eo 'GLIBCXX_[0-9]+([.][0-9]+)+' | sort -V | tail -n 1)"
          test "$max_glibcxx" = "GLIBCXX_3.4.33"
          {
            echo "CC=gcc-14"
            echo "CXX=g++-14"
            echo "MAX_JOBS=1"
            echo "CFLAGS=-frandom-seed=mavi-task12 -ffile-prefix-map=$GITHUB_WORKSPACE=/mavi -fdebug-prefix-map=$GITHUB_WORKSPACE=/mavi"
            echo "CXXFLAGS=-frandom-seed=mavi-task12 -ffile-prefix-map=$GITHUB_WORKSPACE=/mavi -fdebug-prefix-map=$GITHUB_WORKSPACE=/mavi"
            echo "LDFLAGS=-Wl,--build-id=none"
            echo "ARFLAGS=rcD"
            echo "ZERO_AR_DATE=1"
          } >> "$GITHUB_ENV"

      - name: Checkout immutable MMCV 2.1.0 source
        shell: bash
        run: |
          set -euo pipefail
          git init .task12-mmcv
          git -C .task12-mmcv remote add origin https://github.com/open-mmlab/mmcv.git
          git -C .task12-mmcv fetch --depth 1 origin 57c4e25e06e2d4f8a9357c84bcd24089a284dc88
          git -C .task12-mmcv checkout --detach FETCH_HEAD
          test "$(git -C .task12-mmcv rev-parse HEAD)" = "57c4e25e06e2d4f8a9357c84bcd24089a284dc88"

      - name: Build local MMCV wheel
        working-directory: .task12-mmcv
        run: python -m pip wheel --no-build-isolation --no-deps . -w ../.task12-wheelhouse

      - name: Prove clean MMCV wheel reproducibility
        if: runner.os == 'Linux'
        working-directory: .task12-mmcv
        shell: bash
        run: |
          set -euo pipefail
          first="$(find ../.task12-wheelhouse -maxdepth 1 -type f -name 'mmcv-2.1.0-*.whl' -print -quit)"
          test -n "$first"
          first_hash="$(sha256sum "$first" | awk '{print $1}')"
          mv "$first" ../.task12-mmcv-first.whl
          git clean -xfd
          python -m pip wheel --no-build-isolation --no-deps . -w ../.task12-wheelhouse
          second="$(find ../.task12-wheelhouse -maxdepth 1 -type f -name 'mmcv-2.1.0-*.whl' -print -quit)"
          second_hash="$(sha256sum "$second" | awk '{print $1}')"
          test "$first_hash" = "$second_hash"
          cmp ../.task12-mmcv-first.whl "$second"
          rm ../.task12-mmcv-first.whl

      - name: Download exact CPU Torch wheels into wheelhouse
        run: >-
          python -m pip download
          --no-deps
          --only-binary=:all:
          --dest .task12-wheelhouse
          torch==2.6.0
          torchvision==0.21.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Materialize reviewed third-party runtime closure
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src/vision python - <<'PY'
          import os
          from pathlib import Path
          from mavi_vision.runtime.offline_lock import load_offline_runtime_lock

          variant = os.environ["MAVI_RUNTIME_VARIANT"]
          lock_path = Path("src/vision/runtime/mmdetection-phase1-v1") / f"{variant}.lock"
          lock = load_offline_runtime_lock(lock_path)
          if any(item.name == "mavi-vision" for item in lock.distributions):
              raise SystemExit("task12_first_party_distribution_forbidden")
          locally_materialized = {"mmcv", "torch", "torchvision"}
          rows = [
              f"{item.name}=={item.version} --hash=sha256:{item.sha256}"
              for item in lock.distributions
              if item.name not in locally_materialized
          ]
          Path(".task12-reviewed-third-party.txt").write_text(
              "\n".join(rows) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          python -m pip download \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --dest .task12-wheelhouse \
            -r .task12-reviewed-third-party.txt

      - name: Regenerate and compare deterministic third-party lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .task12-generated
          python tools/vision/freeze_offline_lock.py \
            --wheelhouse .task12-wheelhouse \
            --platform-variant "$MAVI_RUNTIME_VARIANT" \
            --python-version "$MAVI_PYTHON_VERSION" \
            --output ".task12-generated/$MAVI_RUNTIME_VARIANT.lock"
          cmp ".task12-generated/$MAVI_RUNTIME_VARIANT.lock" \
              "src/vision/runtime/mmdetection-phase1-v1/$MAVI_RUNTIME_VARIANT.lock"

      - name: Verify application runtime requirements projection
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src/vision python - <<'PY'
          import os
          from pathlib import Path
          from mavi_vision.runtime.offline_lock import (
              load_offline_runtime_lock,
              validate_offline_runtime_lock_for_runtime,
          )
          from mavi_vision.runtime.requirements_projection import (
              build_runtime_requirements_projection,
              serialize_runtime_requirements_projection,
          )

          variant = os.environ["MAVI_RUNTIME_VARIANT"]
          python_version = os.environ["MAVI_PYTHON_VERSION"]
          root = Path("src/vision/runtime/mmdetection-phase1-v1")
          projection = build_runtime_requirements_projection(
              Path("src/vision/pyproject.toml"),
              platform_variant=variant,
              python_version=python_version,
          )
          expected = (root / f"{variant}.requirements.txt").read_bytes()
          actual = serialize_runtime_requirements_projection(projection)
          if actual != expected:
              raise SystemExit("task12_runtime_requirements_projection_mismatch")
          lock = load_offline_runtime_lock(root / f"{variant}.lock")
          validate_offline_runtime_lock_for_runtime(
              lock,
              expected_variant=variant,
              expected_python_version=python_version,
              semantic_graph={},
              binary_versions=None,
              root_requirements=projection.requirements,
          )
          PY

      - name: Create fresh offline-style installation environment
        run: python -m venv .task12-offline-venv

      - name: Install third-party lock with no index and no source builds
        shell: bash
        env:
          PIP_NO_INDEX: '1'
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          set -euo pipefail
          if test "${RUNNER_OS}" = "Windows"; then
            PY=".task12-offline-venv/Scripts/python.exe"
          else
            PY=".task12-offline-venv/bin/python"
          fi
          "$PY" -m pip install \
            --no-index \
            --only-binary=:all: \
            --require-hashes \
            --find-links .task12-wheelhouse \
            -r ".task12-generated/$MAVI_RUNTIME_VARIANT.lock"
          "$PY" -m pip check
          if "$PY" -c "import importlib.metadata; importlib.metadata.version('mavi-vision')" 2>/dev/null; then
            echo "mavi-vision must not be installed in the reusable runtime pack" >&2
            exit 1
          fi

      - name: Verify installed heavy runtime graph
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          set -euo pipefail
          if test "${RUNNER_OS}" = "Windows"; then
            PY=".task12-offline-venv/Scripts/python.exe"
          else
            PY=".task12-offline-venv/bin/python"
          fi
          "$PY" - <<'PY'
          import importlib.metadata
          import json
          import av
          import cv2
          import mmcv
          import mmdet
          import mmengine
          import numpy
          import scipy
          import supervision
          import torch
          import torchvision
          from mmcv.ops import nms

          profile = json.load(open(
              "src/vision/runtime/mmdetection-phase1-v1/runtime.json",
              encoding="utf-8",
          ))
          expected = profile["semanticGraph"]
          actual = {
              "torch": torch.__version__.split("+", 1)[0],
              "torchvision": torchvision.__version__.split("+", 1)[0],
              "mmcv": mmcv.__version__,
              "mmengine": mmengine.__version__,
              "mmdet": mmdet.__version__,
              "trackers": importlib.metadata.version("trackers"),
              "supervision": supervision.__version__,
              "scipy": scipy.__version__,
              "numpy": numpy.__version__,
              "opencv": cv2.__version__,
              "opencvPython": importlib.metadata.version("opencv-python"),
              "pillow": importlib.metadata.version("Pillow"),
              "av": av.__version__,
          }
          if actual != expected:
              raise SystemExit(
                  "task12_semantic_graph_mismatch:"
                  + json.dumps({"actual": actual, "expected": expected}, sort_keys=True)
              )
          _ = nms
          print("task12-third-party-runtime-ok", json.dumps(actual, sort_keys=True))
          PY

      - name: Acquire signed CPython 3.12.10 Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path .task12-prerequisites -Force | Out-Null
          $uri = "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe"
          $out = ".task12-prerequisites/python-3.12.10-amd64.exe"
          & curl.exe --fail --location --retry 3 --retry-all-errors --output $out $uri
          if ($LASTEXITCODE -ne 0) { throw "CPython 3.12.10 download failed." }
          $signature = Get-AuthenticodeSignature -FilePath $out
          if ($signature.Status -ne "Valid") {
            throw "CPython installer Authenticode signature is not valid: $($signature.Status)"
          }
          $version = (Get-Item $out).VersionInfo.ProductVersion
          if (-not $version.StartsWith("3.12.10")) {
            throw "Unexpected CPython installer product version: $version"
          }

      - name: Build reusable Runtime Binary Pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if test "${RUNNER_OS}" = "Windows"; then
            EXTRA_ARGS+=(--python-installer .task12-prerequisites/python-3.12.10-amd64.exe)
          fi
          python tools/vision/build_runtime_pack.py \
            --wheelhouse .task12-wheelhouse \
            --lock "src/vision/runtime/mmdetection-phase1-v1/$MAVI_RUNTIME_VARIANT.lock" \
            --requirements "src/vision/runtime/mmdetection-phase1-v1/$MAVI_RUNTIME_VARIANT.requirements.txt" \
            --platform-variant "$MAVI_RUNTIME_VARIANT" \
            --python-version "$MAVI_PYTHON_VERSION" \
            --native-abi "$MAVI_NATIVE_ABI" \
            --assembled-from-commit "$MAVI_EXPECTED_SOURCE_SHA" \
            "${EXTRA_ARGS[@]}" \
            --output ".task12-runtime-pack/$MAVI_RUNTIME_VARIANT" \
            > .task12-runtime-pack-manifest-output.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(
              (Path(".task12-runtime-pack") / os.environ["MAVI_RUNTIME_VARIANT"] / "runtime-pack-manifest.json").read_text(encoding="utf-8")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"runtime_pack_id={manifest['runtimePackId']}\n")
          print("task12-runtime-pack-id=" + manifest["runtimePackId"])
          PY

      - name: Upload deterministic lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task12-lock-${{ matrix.variant }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .task12-generated/${{ matrix.variant }}.lock
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Upload reusable Runtime Binary Pack
        uses: actions/upload-artifact@v4
        with:
          name: task12-runtime-pack-${{ matrix.variant }}-${{ steps.pack.outputs.runtime_pack_id }}
          path: .task12-runtime-pack/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
